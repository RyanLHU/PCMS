<h3 id="%E6%89%BE%E5%88%B0-y%E4%B8%8D%E4%BB%A3%E8%A1%A8%E7%AB%8B%E5%88%BB%E7%B5%90%E6%9D%9F-bfs">找到 Y，不代表立刻結束 BFS</h3>
<ol>
<li>A（距離 2）找到 Y（距離 3），記錄 <strong>shortest = 3</strong>。</li>
<li>繼續處理其他距離 2 的點；C 仍可找到 W（距離 3）。</li>
<li>不再擴展距離 3 的點，也不搜尋更深的距離。</li>
</ol>
<p><strong>完成所有距離 d−1 的擴展，找齊距離 d 的終點；不往 d+1 搜尋。</strong></p>
<p>3 不是預設值。若距離 1 就找到空右點，本輪 shortest 就是 1；若所有可達點都搜完仍找不到，則沒有增廣路。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-class="topic-hk" data-theme="default" lang="C" class="topic-hk" data-marpit-pagination="42" style="--paginate:true;--class:topic-hk;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="bfs-%E2%86%92-dfs%E4%BA%A4%E6%8E%A5%E7%9A%84%E6%98%AF%E8%B7%9D%E9%9B%A2%E9%99%90%E5%88%B6%E4%B8%8D%E6%98%AF%E4%B8%80%E7%B5%84%E5%B7%B2%E9%81%B8%E8%B7%AF%E5%BE%91">BFS → DFS｜交接的是距離限制，不是一組已選路徑</h2>
<div class="cols">
<div>
<h3 id="bfs-%E7%95%99%E4%B8%8B%E7%9A%84%E8%B3%87%E6%96%99">BFS 留下的資料</h3>
<table>
<thead>
<tr>
<th>dist 值</th>
<th>頂點</th>
</tr>
</thead>
<tbody>
<tr>
<td>0</td>
<td>B、D</td>
</tr>
<tr>
<td>1</td>
<td>X、Z</td>
</tr>
<tr>
<td>2</td>
<td>A、C</td>
</tr>
<tr>
<td>3</td>
<td>Y、W</td>
</tr>
</tbody>
</table>
<p><strong>shortest = 3</strong>；原配對仍是 A–X、C–Z。</p>
<p>dist[v]：從任一空左點出發，沿交替方向到 v 的最少邊數。</p>
</div>
<div>
<h3 id="dfs-%E5%A6%82%E4%BD%95%E4%BD%BF%E7%94%A8%E9%80%99%E5%BC%B5%E8%A1%A8">DFS 如何使用這張表？</h3>
<table>
<thead>
<tr>
<th>嘗試的步驟</th>
<th>分層檢查</th>
</tr>
</thead>
<tbody>
<tr>
<td>B → X</td>
<td>0 → 1，可以走</td>
</tr>
<tr>
<td>X → A</td>
<td>1 → 2，可以走</td>
</tr>
<tr>
<td>A → Y</td>
<td>2 → 3，可以走</td>
</tr>
<tr>
<td>到達空右點 Y</td>
<td>dist[Y] = shortest，成功</td>
</tr>
</tbody>
</table>
<p>DFS 同時遵守交替走邊方向，以及 <strong>dist[v] = dist[u]+1</strong>。</p>
<p>找到路後才翻轉匹配；其他 DFS 可繼續使用本輪距離表。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-class="topic-hk" data-theme="default" lang="C" class="topic-hk" data-marpit-pagination="43" style="--paginate:true;--class:topic-hk;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E7%82%BA%E4%BB%80%E9%BA%BC%E9%82%84%E8%A6%81-dfs%E5%88%86%E5%B1%A4%E4%B8%8D%E7%AD%89%E6%96%BC%E5%AE%8C%E6%88%90%E9%81%B8%E8%B7%AF">為什麼還要 DFS？｜分層不等於完成選路</h2>
<p>BFS 只計算每個頂點的最短距離；同一對相鄰層之間，可能有許多候選邊。</p>
<table>
<thead>
<tr>
<th>BFS 已完成</th>
<th>DFS 接著處理</th>
</tr>
</thead>
<tbody>
<tr>
<td>最短終點距離是多少？</td>
<td>從某個空左點實際走哪條路？</td>
</tr>
<tr>
<td>哪些邊符合下一層距離？</td>
<td>碰到衝突或死路，回溯試其他鄰居</td>
</tr>
<tr>
<td>哪些空右點同樣近？</td>
<td>找到路後改配，繼續增廣其他互斥路徑</td>
</tr>
</tbody>
</table>
<p><strong>只求一條增廣路時，BFS 記錄父節點，也可以直接還原並增廣。</strong></p>
<p>Hopcroft–Karp 使用分層 DFS，是為了在同一份 BFS 距離資訊中，有效找出一組頂點互斥的最短增廣路。</p>
<p>接下來的兩次 DFS 都使用上頁的 dist 表，匹配數才會由 2 增為 3、再增為 4。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-class="topic-hk example" data-theme="default" lang="C" class="topic-hk example" data-marpit-pagination="44" style="--paginate:true;--class:topic-hk example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="dfs-%E2%91%A0%E6%B2%BF%E4%B8%8A%E5%88%97%E8%B5%B0%E5%88%B0%E5%BA%95%E5%86%8D%E7%BF%BB%E8%BD%89%E9%85%8D%E5%B0%8D">DFS ①｜沿上列走到底，再翻轉配對</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-hk-clear-dfs-1.svg" alt="" style="width:560px;" /></p>
<p>橙色標出本次選路；下列尚未使用。</p>
</div>
<div>
<h3 id="%E5%BE%9E-b-%E5%87%BA%E7%99%BC%E6%89%BE%E5%88%B0%E7%A9%BA%E5%8F%B3%E9%BB%9E-y">從 B 出發，找到空右點 Y</h3>
<p><strong>B → X → A → Y</strong>，距離依序為 0、1、2、3。</p>
<p>找到 Y 後，依遞迴回傳更新：</p>
<ol>
<li>A 改配 Y，設定 matchR[Y]=A。</li>
<li>B 改配 X，設定 matchR[X]=B。</li>
</ol>
<table>
<thead>
<tr>
<th>更新前</th>
<th>更新後</th>
</tr>
</thead>
<tbody>
<tr>
<td>A–X、C–Z</td>
<td><strong>A–Y、B–X</strong>、C–Z</td>
</tr>
</tbody>
</table>
<p>匹配數 <strong>2 → 3</strong>。這時才真正改變配對。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-class="topic-hk example" data-theme="default" lang="C" class="topic-hk example" data-marpit-pagination="45" style="--paginate:true;--class:topic-hk example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="dfs-%E2%91%A1%E6%B2%BF%E4%B8%8B%E5%88%97%E5%86%8D%E5%A2%9E%E5%BB%A3%E4%B8%80%E6%AC%A1%E4%B8%8D%E5%BF%85%E9%87%8D%E5%81%9A-bfs">DFS ②｜沿下列再增廣一次，不必重做 BFS</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-hk-clear-dfs-2.svg" alt="" style="width:560px;" /></p>
<p>下列與上列不共用頂點，可以在同一階段接著使用。</p>
</div>
<div>
<h3 id="%E5%BE%9E-d-%E5%87%BA%E7%99%BC%E6%89%BE%E5%88%B0%E7%A9%BA%E5%8F%B3%E9%BB%9E-w">從 D 出發，找到空右點 W</h3>
<p><strong>D → Z → C → W</strong>，仍符合原本 0、1、2、3 的分層。</p>
<ol>
<li>C 改配 W，設定 matchR[W]=C。</li>
<li>D 改配 Z，設定 matchR[Z]=D。</li>
</ol>
<table>
<thead>
<tr>
<th>更新前</th>
<th>更新後</th>
</tr>
</thead>
<tbody>
<tr>
<td>A–Y、B–X、C–Z</td>
<td>A–Y、B–X、<strong>C–W、D–Z</strong></td>
</tr>
</tbody>
</table>
<p>匹配數 <strong>3 → 4</strong>。兩次 DFS 共用同一次 BFS。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-class="topic-hk" data-theme="default" lang="C" class="topic-hk" data-marpit-pagination="46" style="--paginate:true;--class:topic-hk;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="hopcroft%E2%80%93karp%E4%B8%80%E5%80%8B%E9%9A%8E%E6%AE%B5%E7%9A%84%E5%89%8D%E5%BE%8C%E5%B0%8D%E7%85%A7">Hopcroft–Karp｜一個階段的前後對照</h2>
<table>
<thead>
<tr>
<th>時刻</th>
<th>BFS 的工作</th>
<th>DFS 的工作</th>
<th>匹配數</th>
</tr>
</thead>
<tbody>
<tr>
<td>開始</td>
<td>尚未分層</td>
<td>尚未執行</td>
<td>2</td>
</tr>
<tr>
<td>BFS 完成</td>
<td>找到最短長度 3</td>
<td>尚未執行</td>
<td><strong>仍為 2</strong></td>
</tr>
<tr>
<td>DFS 從 B 成功</td>
<td>使用已建立的層次</td>
<td>翻轉 B–X–A–Y</td>
<td>3</td>
</tr>
<tr>
<td>DFS 從 D 成功</td>
<td>使用同一份層次</td>
<td>翻轉 D–Z–C–W</td>
<td>4</td>
</tr>
</tbody>
</table>
<p>本例沒有空左點，已得到完美匹配，可以結束。</p>
<p>一般情況：本階段找不到更多頂點互斥的最短路後，<strong>重新 BFS</strong>；若連空右點都到不了，演算法結束。</p>
<p>BFS 不是直接求出匹配；它讓多次 DFS 能集中處理同一種最短距離。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-class="topic-hk example" data-theme="default" lang="C" class="topic-hk example" data-marpit-pagination="47" style="--paginate:true;--class:topic-hk example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E8%B7%AF%E5%BE%91%E9%87%8D%E7%96%8A-%E2%91%A0%E5%A4%9A%E4%B8%80%E6%A2%9D-b%E2%86%92z%E6%9C%83%E7%99%BC%E7%94%9F%E4%BB%80%E9%BA%BC">路徑重疊 ①｜多一條 B→Z，會發生什麼？</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-hk-overlap-candidates.svg" alt="" style="width:560px;" /></p>
<p>沿用前例，新增未匹配邊 <strong>B–Z</strong>；初始匹配仍是 A–X、C–Z。</p>
</div>
<div>
<h3 id="bfs-%E5%8F%AF%E4%BB%A5%E4%BF%9D%E7%95%99%E6%89%80%E6%9C%89%E6%9C%80%E7%9F%AD%E5%80%99%E9%81%B8">BFS 可以保留所有最短候選</h3>
<ul>
<li>P：<strong>B→Z→C→W</strong>，長度 3。</li>
<li>Q：<strong>D→Z→C→W</strong>，長度 3。</li>
<li>R：<strong>B→X→A→Y</strong>，長度 3。</li>
</ul>
<p>P 與 Q 共用 Z、C、W，不能在同一階段一起選。</p>
<p>P 與 R 也共用起點 B，不能一起選。</p>
<p><strong>R 與 Q 沒有共用頂點，可以一起選。</strong></p>
<p>BFS 只標距離，不負責決定最後選哪一組。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-class="topic-hk example" data-theme="default" lang="C" class="topic-hk example" data-marpit-pagination="48" style="--paginate:true;--class:topic-hk example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E8%B7%AF%E5%BE%91%E9%87%8D%E7%96%8A-%E2%91%A1dfs-%E7%A2%B0%E5%88%B0%E5%B7%B2%E4%BD%BF%E7%94%A8%E7%9A%84%E9%80%9A%E9%81%93%E5%B0%B1%E5%9B%9E%E6%BA%AF">路徑重疊 ②｜DFS 碰到已使用的通道，就回溯</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-hk-overlap-reroute.svg" alt="" style="width:560px;" /></p>
<p>假設本階段先處理 D，已選 Q：<strong>D→Z→C→W</strong>。</p>
</div>
<div>
<h3 id="%E6%8E%A5%E8%91%97%E8%99%95%E7%90%86-b">接著處理 B</h3>
<ol>
<li>B 先嘗試 Z，但 Z、C、W 已被本階段選用的路徑占用。</li>
<li>這條候選不能加入；回到 B，繼續嘗試另一個鄰居 X。</li>
<li>找到 <strong>B→X→A→Y</strong>，與 Q 頂點互斥，成功增廣。</li>
</ol>
<p>翻轉後得到 <strong>D–Z、C–W、B–X、A–Y</strong>，匹配數由 2 增為 4。</p>
<p>常見實作不必真的維護「占用表」：原本指向 C 的 Z 已改配 D，D 卻不在下一個允許層；分層 DFS 便會拒絕沿這條路走。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-class="topic-hk example" data-theme="default" lang="C" class="topic-hk example" data-marpit-pagination="49" style="--paginate:true;--class:topic-hk example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E8%B7%AF%E5%BE%91%E9%87%8D%E7%96%8A-%E2%91%A2%E5%85%88%E9%81%B8%E5%8F%A6%E4%B8%80%E6%A2%9D%E9%80%99%E9%9A%8E%E6%AE%B5%E5%8F%AF%E8%83%BD%E5%8F%AA%E5%A2%9E%E5%BB%A3%E4%B8%80%E6%AC%A1">路徑重疊 ③｜先選另一條，這階段可能只增廣一次</h2>
<div class="cols">
<div>
<h3 id="%E5%A6%82%E6%9E%9C%E5%85%88%E9%81%B8-pb%E2%86%92z%E2%86%92c%E2%86%92w">如果先選 P：B→Z→C→W</h3>
<p>更新後配對為 <strong>A–X、B–Z、C–W</strong>，匹配數由 2 增為 3。</p>
<p>D 的唯一鄰居 Z 已被使用，本階段沒有另一條與 P 頂點互斥的最短路。</p>
<p>這組只有 P 的路徑已是<strong>極大</strong>：不能再加入一條互斥路；但不是條數最多的組合。</p>
<p>演算法不必撤銷 P、重找本輪的最佳路徑組合。</p>
</div>
<div>
<h3 id="%E4%B8%8B%E4%B8%80%E8%BC%AA-bfs-%E6%9C%83%E9%87%8D%E6%96%B0%E5%B0%8B%E6%89%BE">下一輪 BFS 會重新尋找</h3>
<p>配對改變後，新的增廣路是：</p>
<p><strong>D→Z→B→X→A→Y</strong>。</p>
<ul>
<li>長度為 5，超過上一階段限定的 3。</li>
<li>下一輪 BFS 建立新層次，DFS 才能使用。</li>
<li>再翻轉一次，匹配數由 3 增為 <strong>4</strong>。</li>
</ul>
<p><strong>本階段不保證增加最多條；持續執行各階段，最後仍得到最大匹配。</strong></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-class="topic-hk code-page" data-theme="default" lang="C" class="topic-hk code-page" data-marpit-pagination="50" style="--paginate:true;--class:topic-hk code-page;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="hopcroft%E2%80%93karp%E4%B8%80%E8%88%AC%E5%9C%96%E7%9A%84%E9%9A%8E%E6%AE%B5%E6%B5%81%E7%A8%8B">Hopcroft–Karp｜一般圖的階段流程</h2>
<div class="cols">
<div>
<h3 id="%E5%85%A9%E7%A8%AE%E6%83%85%E6%B3%81%E8%A6%81%E5%8D%80%E5%88%86">兩種情況要區分</h3>
<table>
<thead>
<tr>
<th>情況</th>
<th>接下來做什麼？</th>
</tr>
</thead>
<tbody>
<tr>
<td>一個 DFS 分支碰到衝突或死路</td>
<td>回溯，試其他下一層鄰居</td>
</tr>
<tr>
<td>全部空左點已處理，本階段不能再增廣</td>
<td>重新 BFS，建立新層次</td>
</tr>
<tr>
<td>BFS 到不了任何空右點</td>
<td>結束，已是最大匹配</td>
</tr>
</tbody>
</table>
<p>標記走不通的點並記住鄰接邊搜尋進度，避免重複掃描。</p>
</div>
<div>
<h3 id="%E5%AE%8C%E6%95%B4%E6%B5%81%E7%A8%8B">完整流程</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">從空匹配開始
重複：
    BFS 標出到空右點的最短距離
    若到不了任何空右點：結束
    DFS 只走分層允許的邊
    持續增廣頂點互斥的最短路
    本階段結束，重新 BFS
</code></pre>
<p>每輪選極大的一組互斥最短路即可；不需要再解一個「最多條路徑」的最佳化問題。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-class="topic-hk" data-theme="default" lang="C" class="topic-hk" data-marpit-pagination="51" style="--paginate:true;--class:topic-hk;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="hopcroft%E2%80%93karp%E6%95%88%E8%83%BD%E8%88%87%E6%96%B9%E6%B3%95%E9%81%B8%E6%93%87">Hopcroft–Karp｜效能與方法選擇</h2>
<p>設 N 為總頂點數、e 為邊數，L 為左點數。</p>
<table>
<thead>
<tr>
<th>方法</th>
<th>最壞總時間</th>
<th>本題的選擇</th>
</tr>
</thead>
<tbody>
<tr>
<td>逐點 DFS 增廣</td>
<td>O(L(N+e))</td>
<td>n ≤ 200，足夠且容易實作</td>
</tr>
<tr>
<td>Hopcroft–Karp</td>
<td>O(N + e√N)</td>
<td>可以使用；較適合大型無權二分圖</td>
</tr>
</tbody>
</table>
<p>每階段處理完所有可加入的最短路後，下一階段的最短距離會增加；標準分析可將階段數限制在 O(√N)。</p>
<p><strong>Hopcroft–Karp 的最壞時間界較好；本題選 DFS 是因為規模小、程式簡單。</strong></p>
<p>參考：<a href="https://algs4.cs.princeton.edu/code/javadoc/edu/princeton/cs/algs4/HopcroftKarp.html">Princeton Algorithms：HopcroftKarp</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-class="topic-e statement" data-theme="default" lang="C" class="topic-e statement" data-marpit-pagination="52" style="--paginate:true;--class:topic-e statement;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="esensors%E7%90%83%E6%84%9F%E6%B8%AC%E5%99%A8%E8%88%87%E6%93%8D%E4%BD%9C">E｜Sensors：球、感測器與操作</h2>
<div class="cols">
<div>
<h3 id="%E7%90%83%E7%9A%84%E9%A1%8F%E8%89%B2%E5%8F%AA%E6%9C%83%E7%94%B1%E7%B4%85%E8%AE%8A%E8%97%8D">球的顏色只會由紅變藍</h3>
<p>n 顆球由左到右編為 <strong>0…n−1</strong>，初始全紅。</p>
<p>共做 n 次操作：第 t 次把下標 aₜ 的球塗藍，之後不會變回紅色。</p>
<p>題目保證解碼後的 aₜ 互不相同，因此每顆球恰好被塗一次，最後全藍。</p>
<p><img src="20261024-figures/fig-balls.svg" alt="" style="width:490px;" /></p>
</div>
<div>
<h3 id="%E6%84%9F%E6%B8%AC%E5%99%A8%E6%98%AF%E4%B8%80%E6%AE%B5%E5%9B%BA%E5%AE%9A%E7%9B%A3%E8%A6%96%E7%AF%84%E5%9C%8D">感測器是一段固定監視範圍</h3>
<p>m 個感測器編為 <strong>1…m</strong>；第 j 個監視閉區間 [lⱼ,rⱼ]，包含兩端。</p>
<table>
<thead>
<tr>
<th>範圍內剩餘紅球數</th>
<th>感測器狀態</th>
</tr>
</thead>
<tbody>
<tr>
<td>0</td>
<td>不啟動</td>
</tr>
<tr>
<td>1</td>
<td>啟動</td>
</tr>
<tr>
<td>2 顆以上</td>
<td>不啟動</td>
</tr>
</tbody>
</table>
<p>啟動是依「目前顏色」重新判定；曾經啟動的感測器也會停止。</p>
<p>不同感測器的區間可以重疊。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-class="topic-e" data-theme="default" lang="C" class="topic-e" data-marpit-pagination="53" style="--paginate:true;--class:topic-e;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="e%E8%A6%81%E6%B1%82%E8%BC%B8%E5%87%BA%E5%95%9F%E5%8B%95%E7%B7%A8%E8%99%9F%E7%9A%84%E5%B9%B3%E6%96%B9%E5%92%8C">E｜要求輸出：啟動編號的平方和</h2>
<div class="cols">
<div>
<h3 id="%E6%AF%8F%E5%80%8B%E6%99%82%E5%88%BB%E8%BC%B8%E5%87%BA%E4%B8%80%E5%80%8B%E6%95%B4%E6%95%B8">每個時刻輸出一個整數</h3>
<p>令 vₜ 為第 t 次操作完成後，所有啟動感測器的<strong>編號平方和</strong>。</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>v</mi><mi>t</mi></msub><mo>=</mo><munder><mo>∑</mo><mrow><mi>j</mi><mtext> 在時刻 </mtext><mi>t</mi><mtext> 啟動</mtext></mrow></munder><msup><mi>j</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">v_t=\sum_{j\text{ 在時刻 }t\text{ 啟動}}j^2
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.4804em;vertical-align:-1.4304em;"></span><span class="mop op-limits"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.05em;"><span style="top:-1.8557em;margin-left:0em;"><span class="pstrut" style="height:3.05em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">j</span><span class="mord text mtight"><span class="mord mtight"> </span><span class="mord cjk_fallback mtight">在時刻</span><span class="mord mtight"> </span></span><span class="mord mathnormal mtight">t</span><span class="mord text mtight"><span class="mord mtight"> </span><span class="mord cjk_fallback mtight">啟動</span></span></span></span></span><span style="top:-3.05em;"><span class="pstrut" style="height:3.05em;"></span><span><span class="mop op-symbol large-op">∑</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.4304em;"><span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0572em;">j</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span></span></p><ul>
<li>v₀：尚未塗色的初始答案。</li>
<li>每次塗色後輸出 vₜ，共 n+1 個答案。</li>
<li>沒有感測器啟動時，答案為 0。</li>
<li>輸出平方和，不是啟動數量或球的下標。</li>
</ul>
</div>
<div>
<h3 id="%E4%BE%8Bn--3%E5%88%9D%E5%A7%8B%E5%85%A8%E7%B4%85">例：n = 3，初始全紅</h3>
<table>
<thead>
<tr>
<th>感測器編號</th>
<th>監視區間</th>
<th>初始紅球數</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>[0,1]</td>
<td>2</td>
</tr>
<tr>
<td>2</td>
<td>[1,2]</td>
<td>2</td>
</tr>
<tr>
<td>3</td>
<td>[1,1]</td>
<td>1</td>
</tr>
</tbody>
</table>
<p>初始僅 3 號啟動，<strong>v₀ = 3² = 9</strong>。</p>
<p>塗藍下標 0 後，1、3 號啟動：</p>
<p><strong>v₁ = 1² + 3² = 10</strong>。</p>
<p>一顆紅球可被多個感測器監視；答案是編號平方和，不是紅球數或啟動數。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-class="topic-e example" data-theme="default" lang="C" class="topic-e example" data-marpit-pagination="54" style="--paginate:true;--class:topic-e example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="e%E4%BE%8B%E4%B8%80%E5%90%8C%E4%B8%80%E5%80%8B%E6%84%9F%E6%B8%AC%E5%99%A8%E6%9C%83%E5%95%9F%E5%8B%95%E4%B9%9F%E6%9C%83%E5%81%9C%E6%AD%A2">E｜例一：同一個感測器會啟動，也會停止</h2>
<p>n = 3，只有 1 號感測器，監視 [0,2]。依序塗藍下標 1、0、2。</p>
<table>
<thead>
<tr>
<th>時刻</th>
<th>本次塗藍</th>
<th>三顆球：下標 0、1、2</th>
<th>1 號範圍內紅球數</th>
<th>狀態</th>
<th>答案 v</th>
</tr>
</thead>
<tbody>
<tr>
<td>初始</td>
<td>無</td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/></td>
<td>3</td>
<td>不啟動</td>
<td>0</td>
</tr>
<tr>
<td>第 1 次後</td>
<td>1</td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/></td>
<td>2</td>
<td>不啟動</td>
<td>0</td>
</tr>
<tr>
<td>第 2 次後</td>
<td>0</td>
<td><img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/></td>
<td>1</td>
<td>啟動</td>
<td>1² = 1</td>
</tr>
<tr>
<td>第 3 次後</td>
<td>2</td>
<td><img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/></td>
<td>0</td>
<td>不啟動</td>
<td>0</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>紅球數 3 → 2 → 1 → 0；只有「1」的時刻啟動。</strong></p>
</blockquote>
<p>輸出包含初始時刻，因此是 <strong>0 0 1 0</strong>，共 n+1 = 4 個數。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-class="topic-e example" data-theme="default" lang="C" class="topic-e example" data-marpit-pagination="55" style="--paginate:true;--class:topic-e example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="e%E4%BE%8B%E4%BA%8C%E9%87%8D%E7%96%8A%E5%8D%80%E9%96%93%E5%8F%AF%E4%BB%A5%E5%90%8C%E6%99%82%E5%95%9F%E5%8B%95">E｜例二：重疊區間可以同時啟動</h2>
<p>n = 3；1 號監視 [0,1]，2 號監視 [1,2]，3 號監視 [1,1]。</p>
<table>
<thead>
<tr>
<th>操作後</th>
<th>球的顏色：0、1、2</th>
<th>紅球數：1 號／2 號／3 號</th>
<th>啟動編號</th>
<th>答案</th>
</tr>
</thead>
<tbody>
<tr>
<td>初始</td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/></td>
<td>2／2／1</td>
<td>{3}</td>
<td>9</td>
</tr>
<tr>
<td>塗藍 0</td>
<td><img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/></td>
<td>1／2／1</td>
<td>{1,3}</td>
<td>1²+3² = 10</td>
</tr>
<tr>
<td>塗藍 2</td>
<td><img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/></td>
<td>1／1／1</td>
<td>{1,2,3}</td>
<td>1²+2²+3² = 14</td>
</tr>
<tr>
<td>塗藍 1</td>
<td><img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/></td>
<td>0／0／0</td>
<td>無</td>
<td>0</td>
</tr>
</tbody>
</table>
<p>只剩下標 1 的紅球時，三個感測器都能看到它，<strong>三個都啟動</strong>。</p>
<p>一顆紅球可以讓多個感測器啟動；判定是各自針對監視區間進行。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-class="topic-e" data-theme="default" lang="C" class="topic-e" data-marpit-pagination="56" style="--paginate:true;--class:topic-e;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="e%E8%BC%B8%E5%85%A5%E7%B7%A8%E7%A2%BC%E8%88%87%E8%99%95%E7%90%86%E9%A0%86%E5%BA%8F">E｜輸入編碼與處理順序</h2>
<div class="cols">
<div>
<h3 id="%E8%BC%B8%E5%85%A5%E7%9A%84%E6%93%8D%E4%BD%9C%E4%B8%8D%E6%98%AF%E5%AF%A6%E9%9A%9B%E7%90%83%E4%B8%8B%E6%A8%99">輸入的操作不是實際球下標</h3>
<p>每筆測資依序給出 n、m，接著 m 個感測器區間，最後 n 個編碼 a′₁…a′ₙ。</p>
<p>實際下標必須用上一個答案解出：</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>a</mi><mi>t</mi></msub><mo>=</mo><mo stretchy="false">(</mo><msubsup><mi>a</mi><mi>t</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msubsup><mo>+</mo><msub><mi>v</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msub><mo stretchy="false">)</mo><mtext> </mtext><mo lspace="0.22em" rspace="0.22em"><mrow><mi mathvariant="normal">m</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">d</mi></mrow></mo><mtext> </mtext><mi>n</mi></mrow><annotation encoding="application/x-tex">a_t=(a&#x27;_t+v_{t-1})\bmod n
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.0519em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8019em;"><span style="top:-2.453em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">′</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.247em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span><span class="mbin mtight">−</span><span class="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2083em;"><span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.0556em;"></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin"><span class="mord"><span class="mord mathrm">mod</span></span></span><span class="mspace" style="margin-right:0.0556em;"></span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span></span></p><p>每次依序進行：<strong>解碼 → 塗藍 → 更新感測器狀態 → 計算新答案</strong>。</p>
<p>因此不能先把所有操作解碼，再離線處理。</p>
</div>
<div>
<h3 id="%E5%BB%B6%E7%BA%8C%E4%B8%89%E5%80%8B%E6%84%9F%E6%B8%AC%E5%99%A8%E7%9A%84%E4%BE%8B%E5%AD%90">延續三個感測器的例子</h3>
<p>n = 3，初始只有 3 號啟動，v₀ = 9。</p>
<p>若第一個編碼 a′₁ = 0：</p>
<p><strong>a₁ = (0 + 9) mod 3 = 0</strong>。</p>
<p>塗藍下標 0，得到 v₁ = 10；下一個操作必須使用 10 解碼。</p>
<p>n、m 各不超過 5×10⁵；多測的 n 總和、m 總和各不超過 5×10⁵。</p>
<p>v 使用 64 位元整數，解碼為 (a′ₜ + vₜ₋₁ % n) % n。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-class="topic-e code-page example" data-theme="default" lang="C" class="topic-e code-page example" data-marpit-pagination="57" style="--paginate:true;--class:topic-e code-page example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="e%E4%BE%8B%E4%BA%8C%E7%9A%84%E5%AE%8C%E6%95%B4%E8%BC%B8%E5%85%A5%E8%A7%A3%E7%A2%BC%E8%88%87%E8%BC%B8%E5%87%BA">E｜例二的完整輸入、解碼與輸出</h2>
<div class="cols">
<div>
<h3 id="%E4%B8%80%E7%AD%86%E6%B8%AC%E8%B3%87%E7%9A%84%E5%AE%8C%E6%95%B4%E8%BC%B8%E5%85%A5">一筆測資的完整輸入</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">1
3 3
0 1
1 2
1 1
0 1 2
</code></pre>
<p>依序是：測資數、n 與 m、三個感測器區間、三個<strong>編碼</strong>。</p>
<p>輸出：<strong>9 10 14 0</strong>。</p>
</div>
<div>
<h3 id="%E7%B7%A8%E7%A2%BC%E4%B8%8D%E7%AD%89%E6%96%BC%E5%AF%A6%E9%9A%9B%E5%A1%97%E8%89%B2%E9%A0%86%E5%BA%8F">編碼不等於實際塗色順序</h3>
<p>初始答案 v₀ = 9，使用 aₜ = (a′ₜ + vₜ₋₁) mod 3。</p>
<table>
<thead>
<tr>
<th>t</th>
<th>編碼 a′ₜ</th>
<th>上次答案</th>
<th>實際下標 aₜ</th>
<th>新答案</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>0</td>
<td>9</td>
<td>(0+9)%3 = 0</td>
<td>10</td>
</tr>
<tr>
<td>2</td>
<td>1</td>
<td>10</td>
<td>(1+10)%3 = 2</td>
<td>14</td>
</tr>
<tr>
<td>3</td>
<td>2</td>
<td>14</td>
<td>(2+14)%3 = 1</td>
<td>0</td>
</tr>
</tbody>
</table>
<p>輸入是 0、1、2，實際依序塗藍 <strong>0、2、1</strong>。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-class="topic-e" data-theme="default" lang="C" class="topic-e" data-marpit-pagination="58" style="--paginate:true;--class:topic-e;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E7%AF%80%E9%BB%9E%E6%98%AF%E4%B8%80%E6%AE%B5%E4%B8%8B%E6%A8%99--%E6%94%B9%E4%B8%80%E9%A1%86%E7%90%83">節點是一段下標 / 改一顆球</h2>
<div class="cols">
<div>
<h3 id="%E7%AF%80%E9%BB%9E%E6%98%AF%E4%B8%80%E6%AE%B5%E4%B8%8B%E6%A8%99">節點是一段下標</h3>
<p><img src="20261024-figures/fig-tree.svg" alt="" style="width:820px;" /></p>
<p>葉子是單一顆球。父節點的紅球數等於兩個孩子之和。一開始全是紅球，節點初值就是區間長度。</p>
</div>
<div>
<h3 id="%E6%94%B9%E4%B8%80%E9%A1%86%E7%90%83">改一顆球</h3>
<p><img src="20261024-figures/fig-path.svg" alt="" style="width:760px;" /></p>
<ul>
<li>只有包含這個下標的節點會減 1</li>
<li>它們構成根到葉子的一條鏈，長度 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>log</mi><mo>⁡</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\log n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span></li>
<li>鏈以外的節點不動</li>
<li>這裡沒有區間加值，不需要把懶標記下推給孩子</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-class="topic-e" data-theme="default" lang="C" class="topic-e" data-marpit-pagination="59" style="--paginate:true;--class:topic-e;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E4%B8%80%E6%AE%B5%E6%80%8E%E9%BA%BC%E6%8B%86--%E7%82%BA%E4%BB%80%E9%BA%BC%E7%94%A8%E7%B7%9A%E6%AE%B5%E6%A8%B9">一段怎麼拆 / 為什麼用線段樹</h2>
<div class="cols">
<div>
<h3 id="%E4%B8%80%E6%AE%B5%E6%80%8E%E9%BA%BC%E6%8B%86">一段怎麼拆</h3>
<p><img src="20261024-figures/fig-split.svg" alt="" style="width:820px;" /></p>
<p><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">[</mo><mn>2</mn><mo separator="true">,</mo><mn>4</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[2,4]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mord">2</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">4</span><span class="mclose">]</span></span></span></span> 正好是 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">[</mo><mn>2</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[2]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mord">2</span><span class="mclose">]</span></span></span></span>、<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">[</mo><mn>3</mn><mo separator="true">,</mo><mn>4</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[3,4]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mord">3</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">4</span><span class="mclose">]</span></span></span></span>。這兩塊不交，拼起來就是原區間，塊數不超過 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>log</mi><mo>⁡</mo><mi>n</mi></mrow><annotation encoding="application/x-tex">2\log n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">n</span></span></span></span>。</p>
</div>
<div>
<h3 id="%E7%82%BA%E4%BB%80%E9%BA%BC%E7%94%A8%E7%B7%9A%E6%AE%B5%E6%A8%B9">為什麼用線段樹</h3>
<ol>
<li>每個感測器是一段區間，可以拆成 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>log</mi><mo>⁡</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\log n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span> 個不交的節點</li>
<li>區間裡的紅球數，就是這些節點的紅球數之和</li>
<li>恰有一顆，等於其中一塊是 1、其餘每一塊都是 0</li>
<li>所以每塊只留貢獻 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>min</mi><mo>⁡</mo><mo stretchy="false">(</mo><mtext>紅球數</mtext><mo separator="true">,</mo><mn>2</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\min(\text{紅球數},2)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop">min</span><span class="mopen">(</span><span class="mord text"><span class="mord cjk_fallback">紅球數</span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">2</span><span class="mclose">)</span></span></span></span>；貢獻和等於 1 才啟動</li>
<li>紅球只會減少。這個貢獻只在計數從 2 變成 1、從 1 變成 0 時減 1</li>
<li>只有這兩個時刻要通知掛在該節點上的感測器</li>
</ol>
<p>若每次計數變化都通知，一個大節點上可能掛著幾乎全部區間，複雜度退回 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>n</mi><mi>m</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(nm)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord mathnormal">nm</span><span class="mclose">)</span></span></span></span>。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-class="topic-e formula" data-theme="default" lang="C" class="topic-e formula" data-marpit-pagination="60" style="--paginate:true;--class:topic-e formula;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="e%E7%82%BA%E4%BB%80%E9%BA%BC-val--1-%E7%AD%89%E5%83%B9%E6%96%BC%E6%81%B0%E6%9C%89%E4%B8%80%E9%A1%86%E7%B4%85%E7%90%83">E｜為什麼 val = 1 等價於恰有一顆紅球？</h2>
<p>將一個感測器的區間拆成兩個不交節點，逐塊計算 min(cnt,2)。</p>
<table>
<thead>
<tr>
<th>兩塊真實紅球數</th>
<th>兩塊封頂貢獻</th>
<th>val</th>
<th>是否啟動</th>
</tr>
</thead>
<tbody>
<tr>
<td>(1,0)</td>
<td>(1,0)</td>
<td>1</td>
<td>是</td>
</tr>
<tr>
<td>(1,1)</td>
<td>(1,1)</td>
<td>2</td>
<td>否</td>
</tr>
<tr>
<td>(4,0)</td>
<td>(2,0)</td>
<td>2</td>
<td>否</td>
</tr>
<tr>
<td>(0,0)</td>
<td>(0,0)</td>
<td>0</td>
<td>否</td>
</tr>
</tbody>
</table>
<p>所有貢獻皆非負；總和是 1，只可能有一塊是 1、其餘都是 0。</p>
<p>因此不必維護每個感測器的真實紅球總數，只需維護 val。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-class="topic-e" data-theme="default" lang="C" class="topic-e" data-marpit-pagination="61" style="--paginate:true;--class:topic-e;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E5%B0%81%E9%A0%82%E4%B9%8B%E5%BE%8C%E7%9C%8B%E4%BB%80%E9%BA%BC--%E5%93%AA%E4%B8%80%E6%AC%A1%E6%89%8D%E9%80%9A%E7%9F%A5">封頂之後看什麼 / 哪一次才通知</h2>
<div class="cols">
<div>
<h3 id="%E5%B0%81%E9%A0%82%E4%B9%8B%E5%BE%8C%E7%9C%8B%E4%BB%80%E9%BA%BC">封頂之後看什麼</h3>
<p><img src="20261024-figures/fig-saturate.svg" alt="" style="width:920px;" /></p>
<p>圖中每欄是一種計數狀態。計數 2 與 4 的貢獻都封頂為 2；若分解中有這樣一塊，整個區間就不會恰有一顆紅球。</p>
</div>
<div>
<h3 id="%E5%93%AA%E4%B8%80%E6%AC%A1%E6%89%8D%E9%80%9A%E7%9F%A5">哪一次才通知</h3>
<p><img src="20261024-figures/fig-notify.svg" alt="" style="width:1080px;" /></p>
<p>初始 <code>val</code> 用的就是各塊的 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>min</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>c</mi><mi>n</mi><mi>t</mi><mo separator="true">,</mo><mn>2</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\min(cnt,2)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop">min</span><span class="mopen">(</span><span class="mord mathnormal">c</span><span class="mord mathnormal">n</span><span class="mord mathnormal">t</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">2</span><span class="mclose">)</span></span></span></span>。通知時把 <code>val</code> 減 1，兩者才對得起來。若初始用真實紅球數，卻只在這兩次才減，<code>val</code> 會是錯的。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-class="topic-e example" data-theme="default" lang="C" class="topic-e example" data-marpit-pagination="62" style="--paginate:true;--class:topic-e example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="e%E7%B7%9A%E6%AE%B5%E6%A8%B9%E7%AF%84%E4%BE%8B%E4%BA%94%E9%A1%86%E7%90%83%E5%9B%9B%E5%80%8B%E6%84%9F%E6%B8%AC%E5%99%A8">E｜線段樹範例：五顆球、四個感測器</h2>
<p>以下使用較大的例子展示區間分解：n = 5，下標 0…4；初始全紅。</p>
<table>
<thead>
<tr>
<th>編號 id</th>
<th>監視區間</th>
<th>分解節點</th>
<th>初始 val</th>
<th>初始啟動？</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>[2,4]</td>
<td>[2]、[3,4]</td>
<td>1 + 2 = 3</td>
<td>否</td>
</tr>
<tr>
<td>2</td>
<td>[2,3]</td>
<td>[2]、[3]</td>
<td>1 + 1 = 2</td>
<td>否</td>
</tr>
<tr>
<td>3</td>
<td>[3,3]</td>
<td>[3]</td>
<td>1</td>
<td>是</td>
</tr>
<tr>
<td>4</td>
<td>[0,2]</td>
<td>[0,2]</td>
<td>min(3,2) = 2</td>
<td>否</td>
</tr>
</tbody>
</table>
<p><strong>val 是各分解節點的封頂貢獻和；初始 v₀ = 3² = 9。</strong></p>
<p>若第一筆編碼 a′₁ = 3，則真實下標 (3 + 9) mod 5 = 2。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-class="topic-e example" data-theme="default" lang="C" class="topic-e example" data-marpit-pagination="63" style="--paginate:true;--class:topic-e example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E6%A8%A3%E4%BE%8B%E6%80%8E%E9%BA%BC%E6%8E%9B--%E6%8A%8A-2-%E8%99%9F%E7%90%83%E5%A1%97%E8%97%8D">樣例怎麼掛 / 把 2 號球塗藍</h2>
<div class="cols">
<div>
<h3 id="%E6%A8%A3%E4%BE%8B%E6%80%8E%E9%BA%BC%E6%8E%9B">樣例怎麼掛</h3>
<p><img src="20261024-figures/fig-sample-tree.svg" alt="" style="width:820px;" /></p>
</div>
<div>
<h3 id="%E6%8A%8A-2-%E8%99%9F%E7%90%83%E5%A1%97%E8%97%8D">把 2 號球塗藍</h3>
<p>第一筆真實下標是 2。沿路三個節點：</p>
<table>
<thead>
<tr>
<th>節點</th>
<th>紅球數</th>
<th>通知</th>
</tr>
</thead>
<tbody>
<tr>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">[</mo><mn>0</mn><mo separator="true">,</mo><mn>4</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[0,4]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">4</span><span class="mclose">]</span></span></span></span></td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>5</mn><mo>→</mo><mn>4</mn></mrow><annotation encoding="application/x-tex">5\to 4</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">5</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">4</span></span></span></span></td>
<td>不通知</td>
</tr>
<tr>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">[</mo><mn>0</mn><mo separator="true">,</mo><mn>2</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[0,2]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">2</span><span class="mclose">]</span></span></span></span></td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>3</mn><mo>→</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">3\to 2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">3</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span></span></span></span></td>
<td>不通知</td>
</tr>
<tr>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">[</mo><mn>2</mn><mo separator="true">,</mo><mn>2</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[2,2]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mord">2</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">2</span><span class="mclose">]</span></span></span></span></td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mo>→</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">1\to 0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span></td>
<td>減 1 號、2 號</td>
</tr>
</tbody>
</table>
<ul>
<li>1 號：<code>val</code> 從 3 到 2，仍不啟動</li>
<li>2 號：<code>val</code> 從 2 到 1，開始啟動</li>
<li>4 號掛在 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">[</mo><mn>0</mn><mo separator="true">,</mo><mn>2</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">[0,2]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">2</span><span class="mclose">]</span></span></span></span> 上，這次不通知，<code>val</code> 維持 2</li>
<li>啟動的是 2 和 3，<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>v</mi><mn>1</mn></msub><mo>=</mo><msup><mn>2</mn><mn>2</mn></msup><mo>+</mo><msup><mn>3</mn><mn>2</mn></msup><mo>=</mo><mn>13</mn></mrow><annotation encoding="application/x-tex">v_1=2^2+3^2=13</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8974em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord"><span class="mord">3</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">13</span></span></span></span></li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-class="topic-e" data-theme="default" lang="C" class="topic-e" data-marpit-pagination="64" style="--paginate:true;--class:topic-e;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="e%E7%B8%BD%E6%88%90%E6%9C%AC%E8%88%87%E4%B8%8D%E8%AE%8A%E9%87%8F">E｜總成本與不變量</h2>
<div class="cols">
<div>
<h3 id="%E6%AF%8F%E5%80%8B%E5%8D%80%E9%96%93%E6%9B%B4%E6%96%B0%E5%B9%BE%E6%AC%A1">每個區間更新幾次</h3>
<ul>
<li>一個區間掛在不超過 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>log</mi><mo>⁡</mo><mi>n</mi></mrow><annotation encoding="application/x-tex">2\log n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">n</span></span></span></span> 個節點上</li>
<li>每個節點最多通知它兩次</li>
<li>所以每個區間最多被碰到 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>4</mn><mi>log</mi><mo>⁡</mo><mi>n</mi></mrow><annotation encoding="application/x-tex">4\log n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord">4</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">n</span></span></span></span> 次</li>
<li>全部區間合計 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>m</mi><mi>log</mi><mo>⁡</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(m\log n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord mathnormal">m</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span></li>
<li>每次塗色再走一條 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>log</mi><mo>⁡</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\log n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span> 的鏈</li>
<li>總時間 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mo stretchy="false">(</mo><mi>n</mi><mo>+</mo><mi>m</mi><mo stretchy="false">)</mo><mi>log</mi><mo>⁡</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O((n+m)\log n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">((</span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">m</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span></li>
<li>空間 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>n</mi><mo>+</mo><mi>m</mi><mi>log</mi><mo>⁡</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(n+m\log n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">m</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span>：樹佔 O(n)，bag 共存 O(m log n) 筆登記</li>
</ul>
</div>
<div>
<h3 id="e-%E9%A1%8C%E5%AE%B9%E6%98%93%E9%8C%AF">E 題容易錯</h3>
<ul>
<li>紅球數一變就通知全部區間</li>
<li>初始 <code>val</code> 用真實數量，通知卻按封頂規則</li>
<li>只改葉子，祖先上的大區間還是舊的計數</li>
<li>平方和用 32 位元整數</li>
<li>解碼時 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span> 先加再取模，中間溢位</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-class="topic-e" data-theme="default" lang="C" class="topic-e" data-marpit-pagination="65" style="--paginate:true;--class:topic-e;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="e%E5%88%9D%E5%A7%8B%E5%8C%96%E8%88%87%E5%96%AE%E6%AC%A1%E6%9B%B4%E6%96%B0">E｜初始化與單次更新</h2>
<div class="cols">
<div>
<h3 id="%E5%88%9D%E5%A7%8B%E5%8C%96%E4%B8%80%E6%AC%A1">初始化一次</h3>
<ol>
<li>建樹：cnt[p] = 節點區間長度。</li>
<li>把每個感測器分解成不交的規範節點，編號登記在 bag[p]。</li>
<li>累加 val[id] = 各塊 min(cnt[p],2) 的總和。</li>
<li>把 val = 1 的編號平方加進 ans，先輸出 v₀。</li>
</ol>
</div>
<div>
<h3 id="%E6%AF%8F%E6%AC%A1%E5%A1%97%E8%97%8D">每次塗藍</h3>
<ol>
<li>用上一個答案解出真實下標 x。</li>
<li>沿根到 x 的路徑，逐一把 cnt 減 1。</li>
<li>新 cnt 是 1 或 0 時，通知 bag 中的感測器。</li>
<li>通知時先移除舊啟動貢獻、val 減 1，再加入新啟動貢獻。</li>
<li>整條路處理完，輸出 ans。</li>
</ol>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-class="topic-e code-page" data-theme="default" lang="C" class="topic-e code-page" data-marpit-pagination="66" style="--paginate:true;--class:topic-e code-page;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E7%99%BB%E8%A8%98%E5%8D%80%E9%96%93--%E5%B9%B3%E6%96%B9%E5%92%8C">登記區間 / 平方和</h2>
<div class="cols">
<div>
<h3 id="%E7%99%BB%E8%A8%98%E5%8D%80%E9%96%93">登記區間</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">add</span><span class="hljs-params">(<span class="hljs-type">int</span> p, <span class="hljs-type">int</span> l, <span class="hljs-type">int</span> r, <span class="hljs-type">int</span> ql, <span class="hljs-type">int</span> qr, <span class="hljs-type">int</span> id)</span> </span>{
    <span class="hljs-keyword">if</span> (ql &lt;= l &amp;&amp; r &lt;= qr) {
        bag[p].<span class="hljs-built_in">push_back</span>(id);
        val[id] += <span class="hljs-built_in">min</span>(cnt[p], <span class="hljs-number">2</span>);
        <span class="hljs-keyword">return</span>;
    }
    <span class="hljs-type">int</span> mid = (l + r) &gt;&gt; <span class="hljs-number">1</span>;
    <span class="hljs-keyword">if</span> (ql &lt;= mid) <span class="hljs-built_in">add</span>(p &lt;&lt; <span class="hljs-number">1</span>, l, mid, ql, qr, id);
    <span class="hljs-keyword">if</span> (qr &gt; mid)  <span class="hljs-built_in">add</span>(p &lt;&lt; <span class="hljs-number">1</span> | <span class="hljs-number">1</span>, mid + <span class="hljs-number">1</span>, r, ql, qr, id);
}
</code></pre>
<p>全部登記完，再把 <code>val[id]==1</code> 的編號加進 <code>ans</code>，這就是 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>v</mi><mn>0</mn></msub></mrow><annotation encoding="application/x-tex">v_0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span>。</p>
</div>
<div>
<h3 id="%E5%B9%B3%E6%96%B9%E5%92%8C">平方和</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">touch</span><span class="hljs-params">(<span class="hljs-type">int</span> id)</span> </span>{
    <span class="hljs-keyword">if</span> (val[id] == <span class="hljs-number">1</span>) ans -= <span class="hljs-number">1LL</span> * id * id;
    val[id]--;
    <span class="hljs-keyword">if</span> (val[id] == <span class="hljs-number">1</span>) ans += <span class="hljs-number">1LL</span> * id * id;
}
</code></pre>
<p><code>val</code> 從 2 到 1 時加進平方和，從 1 到 0 時拿掉。編號從 1 開始。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-class="topic-e code-page" data-theme="default" lang="C" class="topic-e code-page" data-marpit-pagination="67" style="--paginate:true;--class:topic-e code-page;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E5%A1%97%E8%97%8D--%E5%9C%A8%E7%B7%9A%E8%A7%A3%E7%A2%BC">塗藍 / 在線解碼</h2>
<div class="cols">
<div>
<h3 id="%E5%A1%97%E8%97%8D">塗藍</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">paint</span><span class="hljs-params">(<span class="hljs-type">int</span> p, <span class="hljs-type">int</span> l, <span class="hljs-type">int</span> r, <span class="hljs-type">int</span> x)</span> </span>{
    cnt[p]--;
    <span class="hljs-keyword">if</span> (cnt[p] == <span class="hljs-number">0</span> || cnt[p] == <span class="hljs-number">1</span>)
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> id : bag[p]) <span class="hljs-built_in">touch</span>(id);
    <span class="hljs-keyword">if</span> (l == r) <span class="hljs-keyword">return</span>;
    <span class="hljs-type">int</span> mid = (l + r) &gt;&gt; <span class="hljs-number">1</span>;
    <span class="hljs-keyword">if</span> (x &lt;= mid) <span class="hljs-built_in">paint</span>(p &lt;&lt; <span class="hljs-number">1</span>, l, mid, x);
    <span class="hljs-keyword">else</span> <span class="hljs-built_in">paint</span>(p &lt;&lt; <span class="hljs-number">1</span> | <span class="hljs-number">1</span>, mid + <span class="hljs-number">1</span>, r, x);
}
</code></pre>
<p>同一感測器的分解節點互不相交；一次塗色至多命中其中一塊，因此最多收到一次通知。</p>
</div>
<div>
<h3 id="%E5%9C%A8%E7%B7%9A%E8%A7%A3%E7%A2%BC">在線解碼</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">out.<span class="hljs-built_in">push_back</span>(ans); <span class="hljs-comment">// v0</span>
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; n; i++) {
    <span class="hljs-type">int</span> x = (a[i] + out.<span class="hljs-built_in">back</span>() % n) % n;
    <span class="hljs-built_in">paint</span>(<span class="hljs-number">1</span>, <span class="hljs-number">0</span>, n - <span class="hljs-number">1</span>, x);
    out.<span class="hljs-built_in">push_back</span>(ans);
}
</code></pre>
<p><code>a[i]</code> 是輸入的 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msubsup><mi>a</mi><mi>i</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msubsup></mrow><annotation encoding="application/x-tex">a&#x27;_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0106em;vertical-align:-0.2587em;"></span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.7519em;"><span style="top:-2.4413em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">′</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2587em;"><span></span></span></span></span></span></span></span></span></span>。題目保證解出來的下標互不相同。多測要清空每個 <code>bag</code>。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-class="summary" data-theme="default" lang="C" class="summary" data-marpit-pagination="68" style="--paginate:true;--class:summary;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="he%E5%BB%BA%E6%A8%A1%E8%88%87%E7%8B%80%E6%85%8B%E7%B6%AD%E8%AD%B7">H、E｜建模與狀態維護</h2>
<table>
<thead>
<tr>
<th></th>
<th>H. 阻止城堡</th>
<th>E. 感測器</th>
</tr>
</thead>
<tbody>
<tr>
<td>題目要的</td>
<td>讓所有攻擊對都消失</td>
<td>區間是否恰有一顆紅球</td>
</tr>
<tr>
<td>一個動作影響誰</td>
<td>一格最多一橫一豎</td>
<td>根到葉子的一條鏈</td>
</tr>
<tr>
<td>可以忽略的變化</td>
<td>同一攻擊對內等效的單殺位置</td>
<td>紅球數在 2 以上的減少</td>
</tr>
<tr>
<td>保留下來的結構</td>
<td>二分圖的邊</td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>min</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>c</mi><mi>n</mi><mi>t</mi><mo separator="true">,</mo><mn>2</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\min(cnt,2)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop">min</span><span class="mopen">(</span><span class="mord mathnormal">c</span><span class="mord mathnormal">n</span><span class="mord mathnormal">t</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">2</span><span class="mclose">)</span></span></span></span></td>
</tr>
<tr>
<td>演算法</td>
<td>DFS 增廣</td>
<td>只在 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mo>→</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">2\to 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span>、<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mo>→</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">1\to 0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span> 通知</td>
</tr>
<tr>
<td>答案</td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>P</mi><mo>−</mo><mi>M</mi></mrow><annotation encoding="application/x-tex">P-M</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span></span></span></span></td>
<td>啟動編號的平方和</td>
</tr>
</tbody>
</table>
</section>

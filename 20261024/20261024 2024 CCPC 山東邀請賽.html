<h1 id="%E5%B1%B1%E6%9D%B1%E9%82%80%E8%AB%8B%E8%B3%BD%E5%9B%9B%E9%A1%8C%E8%A7%A3%E6%9E%90">山東邀請賽｜四題解析</h1>
<p>2024 CCPC 山東邀請賽</p>
<p>I. Left Shifting · F. Divide the Sequence</p>
<p>H. Stop the Castle · E. Sensors</p>
<p>2026.10.24</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-class="summary" data-theme="default" lang="C" class="summary" data-marpit-pagination="2" style="--paginate:true;--class:summary;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E5%9B%9B%E9%A1%8C%E7%9A%84%E8%A7%A3%E9%A1%8C%E8%B7%AF%E7%B7%9A">四題的解題路線</h2>
<table>
<thead>
<tr>
<th>題目</th>
<th>核心問題</th>
<th>方法</th>
<th>時間</th>
</tr>
</thead>
<tbody>
<tr>
<td>I. Left Shifting</td>
<td>左移幾次才能首尾相同？</td>
<td>環狀下標、枚舉</td>
<td>O(n)</td>
</tr>
<tr>
<td>F. Divide the Sequence</td>
<td>每種段數的最大加權和？</td>
<td>後綴和、排序、貪心</td>
<td>O(n log n)</td>
</tr>
<tr>
<td>H. Stop the Castle</td>
<td>最少增加幾個障礙？</td>
<td>二分圖最大匹配</td>
<td>O(n³)</td>
</tr>
<tr>
<td>E. Sensors</td>
<td>塗色後哪些區間恰有一顆紅球？</td>
<td>線段樹、封頂通知</td>
<td>O((n+m) log n)</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-class="topic-i code-page statement" data-theme="default" lang="C" class="topic-i code-page statement" data-marpit-pagination="3" style="--paginate:true;--class:topic-i code-page statement;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="ileft-shifting-%E9%A1%8C%E6%84%8F">I｜Left Shifting 題意</h2>
<div class="cols">
<div>
<h3 id="%E5%B7%A6%E7%A7%BB%E8%88%87%E7%BE%8E%E9%BA%97%E5%AD%97%E4%B8%B2">左移與美麗字串</h3>
<p>字串的第一個與最後一個字元相同，稱為美麗。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">abcde → bcdea → cdeab
原字串   左移 1 次  左移 2 次
</code></pre>
<p>求最小非負左移次數 d；無解輸出 −1。</p>
</div>
<div>
<h3 id="%E5%AE%98%E6%96%B9%E6%A8%A3%E4%BE%8B">官方樣例</h3>
<table>
<thead>
<tr>
<th>字串</th>
<th>最小 d</th>
<th>原因</th>
</tr>
</thead>
<tbody>
<tr>
<td>helloccpc</td>
<td>3</td>
<td>loccpchel 首尾皆 l</td>
</tr>
<tr>
<td>abcdcba</td>
<td>0</td>
<td>原本首尾皆 a</td>
</tr>
<tr>
<td>x</td>
<td>0</td>
<td>唯一字元同時是首尾</td>
</tr>
<tr>
<td>abc</td>
<td>−1</td>
<td>所有旋轉都不符合</td>
</tr>
</tbody>
</table>
<p>每筆 n ≤ 5×10⁵，所有測資的 n 總和 ≤ 5×10⁵。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-class="topic-i" data-theme="default" lang="C" class="topic-i" data-marpit-pagination="4" style="--paginate:true;--class:topic-i;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="i%E5%B7%A6%E7%A7%BB%E5%8F%AA%E6%94%B9%E8%AE%8A%E8%B5%B7%E9%BB%9E">I｜左移只改變起點</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-i-circle.svg" alt="" style="width:550px;" /></p>
<p>環上位置不變；選下標 d 當新起點。</p>
</div>
<div>
<h3 id="%E6%96%B0%E9%A6%96%E5%B0%BE%E6%98%AF%E5%8E%9F%E5%AD%97%E4%B8%B2%E7%9A%84%E5%93%AA%E5%85%A9%E6%A0%BC">新首尾是原字串的哪兩格？</h3>
<ul>
<li>新首字元：s[d]。</li>
<li>新尾字元：s[(d−1+n) mod n]。</li>
<li>尾字元就是環上起點的前一格。</li>
</ul>
<p>因此只要比較這兩格，不必建立旋轉後的字串。</p>
<p><strong>成立條件：s[d] = s[(d−1+n) mod n]。</strong></p>
<p>只需枚舉 0…n−1；左移 n 次回到原字串。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-class="topic-i example" data-theme="default" lang="C" class="topic-i example" data-marpit-pagination="5" style="--paginate:true;--class:topic-i example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="i%E6%A8%A3%E4%BE%8B%E7%9A%84%E6%9C%80%E5%B0%8F%E5%B7%A6%E7%A7%BB%E9%87%8F">I｜樣例的最小左移量</h2>
<p>S = helloccpc，下標從 0 開始。</p>
<table>
<thead>
<tr>
<th>d</th>
<th>新首字元 s[d]</th>
<th>新尾字元</th>
<th>相同？</th>
</tr>
</thead>
<tbody>
<tr>
<td>0</td>
<td>h</td>
<td>s[8] = c</td>
<td>否</td>
</tr>
<tr>
<td>1</td>
<td>e</td>
<td>s[0] = h</td>
<td>否</td>
</tr>
<tr>
<td>2</td>
<td>l</td>
<td>s[1] = e</td>
<td>否</td>
</tr>
<tr>
<td>3</td>
<td>l</td>
<td>s[2] = l</td>
<td>是</td>
</tr>
</tbody>
</table>
<p>左移 3 次：<strong>loccpchel</strong>，首尾都是 l。</p>
<p>d = 0、1、2 都失敗，因此最小答案是 <strong>3</strong>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="topic-i" data-theme="default" lang="C" class="topic-i" data-marpit-pagination="6" style="--paginate:true;--class:topic-i;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="i%E7%B7%9A%E6%80%A7%E6%9E%9A%E8%88%89%E8%88%87%E6%AD%A3%E7%A2%BA%E6%80%A7">I｜線性枚舉與正確性</h2>
<div class="cols">
<div>
<h3 id="%E6%BC%94%E7%AE%97%E6%B3%95">演算法</h3>
<ol>
<li>依序枚舉 d = 0、1、…、n−1。</li>
<li>算出前一格 prev = (d−1+n) mod n。</li>
<li>若 s[d] = s[prev]，立即回傳 d。</li>
<li>全部失敗則回傳 −1。</li>
</ol>
</div>
<div>
<h3 id="%E7%82%BA%E4%BB%80%E9%BA%BC%E5%BE%97%E5%88%B0%E6%9C%80%E5%B0%8F%E7%AD%94%E6%A1%88">為什麼得到最小答案？</h3>
<p>每個可能的旋轉都對應一個 d。</p>
<p>比較原字串的兩個下標，等價於比較旋轉後的首尾。</p>
<p>枚舉順序由小到大，所以第一個成功值就是最小值。</p>
<p><strong>時間 O(n)，額外空間 O(1)</strong>，不含輸入字串。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="topic-i code-page" data-theme="default" lang="C" class="topic-i code-page" data-marpit-pagination="7" style="--paginate:true;--class:topic-i code-page;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="i%E5%AF%A6%E4%BD%9C%E8%88%87%E9%82%8A%E7%95%8C">I｜實作與邊界</h2>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">solve</span><span class="hljs-params">(<span class="hljs-type">const</span> string&amp; s)</span> </span>{
    <span class="hljs-type">int</span> n = (<span class="hljs-type">int</span>)s.<span class="hljs-built_in">size</span>();
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> d = <span class="hljs-number">0</span>; d &lt; n; ++d) {
        <span class="hljs-type">int</span> prev = (d - <span class="hljs-number">1</span> + n) % n;
        <span class="hljs-keyword">if</span> (s[d] == s[prev]) <span class="hljs-keyword">return</span> d;
    }
    <span class="hljs-keyword">return</span> <span class="hljs-number">-1</span>;
}
</code></pre>
</div>
<div>
<h3 id="%E9%82%8A%E7%95%8C%E6%83%85%E6%B3%81">邊界情況</h3>
<ul>
<li>d = 0 必須比較 s[0] 與 s[n−1]。</li>
<li>n = 1 自然得到 d = 0。</li>
<li>找到後立即停止，才能保證最小。</li>
<li>每次建立完整旋轉字串，總時間可能達 O(n²)。</li>
</ul>
<p>多測時逐筆讀入字串並輸出 solve(s)。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-class="topic-f code-page statement" data-theme="default" lang="C" class="topic-f code-page statement" data-marpit-pagination="8" style="--paginate:true;--class:topic-f code-page statement;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="fdivide-the-sequence-%E9%A1%8C%E6%84%8F">F｜Divide the Sequence 題意</h2>
<div class="cols">
<div>
<h3 id="%E6%AF%8F%E5%80%8B-k-%E9%83%BD%E8%A6%81%E4%B8%80%E5%80%8B%E7%AD%94%E6%A1%88">每個 k 都要一個答案</h3>
<p>將 a₁…aₙ 分成恰好 k 段連續、非空子陣列，每個元素恰屬一段。</p>
<p>由左到右的段和為 s₁…sₖ，最大化：</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mn>1</mn><msub><mi>s</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><msub><mi>s</mi><mn>2</mn></msub><mo>+</mo><mo>⋯</mo><mo>+</mo><mi>k</mi><msub><mi>s</mi><mi>k</mi></msub></mrow><annotation encoding="application/x-tex">1s_1+2s_2+\cdots+ks_k
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7944em;vertical-align:-0.15em;"></span><span class="mord">1</span><span class="mord"><span class="mord mathnormal">s</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7944em;vertical-align:-0.15em;"></span><span class="mord">2</span><span class="mord"><span class="mord mathnormal">s</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="minner">⋯</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8444em;vertical-align:-0.15em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mord"><span class="mord mathnormal">s</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span></p><p>輸出 k = 1…n 的全部 n 個最大值。</p>
</div>
<div>
<h3 id="%E5%AE%98%E6%96%B9%E6%A8%A3%E4%BE%8Bk--3">官方樣例：k = 3</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">[1] [3 −4] [5 −1 −2]
</code></pre>
<p>段和是 1、−1、2，分數：</p>
<p><strong>1×1 + 2×(−1) + 3×2 = 5。</strong></p>
<p>n ≤ 5×10⁵，|aᵢ| ≤ 10⁶。</p>
<p>多測的 n 總和 ≤ 5×10⁵。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="topic-f" data-theme="default" lang="C" class="topic-f" data-marpit-pagination="9" style="--paginate:true;--class:topic-f;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="f%E4%B8%80%E5%88%80%E5%A2%9E%E5%8A%A0%E4%B8%80%E5%80%8B%E5%BE%8C%E7%B6%B4%E5%92%8C">F｜一刀增加一個後綴和</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-f-cuts.svg" alt="" style="width:550px;" /></p>
<p>每加一刀，其右方所有元素的係數都增加 1。</p>
</div>
<div>
<h3 id="%E5%BE%9E-k--1-%E5%87%BA%E7%99%BC">從 k = 1 出發</h3>
<p>沒有切割時，每個元素係數都是 1，分數是總和 T。</p>
<p>在 a₂ 後切一刀，增加：</p>
<p><strong>a₃ + a₄ + a₅。</strong></p>
<p>再在 a₄ 後切一刀，增加：</p>
<p><strong>a₅。</strong></p>
<p>兩次增加可以直接相加，得到係數 1、1、2、2、3。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="topic-f formula" data-theme="default" lang="C" class="topic-f formula" data-marpit-pagination="10" style="--paginate:true;--class:topic-f formula;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="f%E5%8A%A0%E6%AC%8A%E6%AE%B5%E5%92%8C%E7%9A%84%E7%AD%89%E5%83%B9%E5%BC%8F">F｜加權段和的等價式</h2>
<p>切在 a₂ 與 a₄ 後：</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mn>1</mn><mo stretchy="false">(</mo><msub><mi>a</mi><mn>1</mn></msub><mo>+</mo><msub><mi>a</mi><mn>2</mn></msub><mo stretchy="false">)</mo><mo>+</mo><mn>2</mn><mo stretchy="false">(</mo><msub><mi>a</mi><mn>3</mn></msub><mo>+</mo><msub><mi>a</mi><mn>4</mn></msub><mo stretchy="false">)</mo><mo>+</mo><mn>3</mn><mo stretchy="false">(</mo><msub><mi>a</mi><mn>5</mn></msub><mo>+</mo><msub><mi>a</mi><mn>6</mn></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">1(a_1+a_2)+2(a_3+a_4)+3(a_5+a_6)
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">2</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">4</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">3</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">5</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">6</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span></p><p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo>=</mo><mo stretchy="false">(</mo><msub><mi>a</mi><mn>1</mn></msub><mo>+</mo><mo>⋯</mo><mo>+</mo><msub><mi>a</mi><mn>6</mn></msub><mo stretchy="false">)</mo><mo>+</mo><mo stretchy="false">(</mo><msub><mi>a</mi><mn>3</mn></msub><mo>+</mo><mo>⋯</mo><mo>+</mo><msub><mi>a</mi><mn>6</mn></msub><mo stretchy="false">)</mo><mo>+</mo><mo stretchy="false">(</mo><msub><mi>a</mi><mn>5</mn></msub><mo>+</mo><msub><mi>a</mi><mn>6</mn></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">=(a_1+\cdots+a_6)+(a_3+\cdots+a_6)+(a_5+a_6)
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.3669em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="minner">⋯</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">6</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="minner">⋯</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">6</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">5</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">6</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span></p><p>令 pᵢ = aᵢ + … + aₙ。在位置 i 後切一刀，貢獻為 pᵢ₊₁。</p>
<blockquote>
<p><strong>分數 = T + 所有選定切點的後綴和。</strong></p>
</blockquote>
<p>每個元素的係數，等於 1 加上它左方的切點數，因此任意多刀都成立。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="topic-f example" data-theme="default" lang="C" class="topic-f example" data-marpit-pagination="11" style="--paginate:true;--class:topic-f example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="f%E5%AE%98%E6%96%B9%E6%A8%A3%E4%BE%8B%E7%9A%84%E5%88%87%E9%BB%9E%E8%B2%A2%E7%8D%BB">F｜官方樣例的切點貢獻</h2>
<p>a = [1,3,−4,5,−1,−2]，總和 T = 2。</p>
<table>
<thead>
<tr>
<th>切在位置 i 後</th>
<th>右方後綴</th>
<th>貢獻 pᵢ₊₁</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>[3,−4,5,−1,−2]</td>
<td>1</td>
</tr>
<tr>
<td>2</td>
<td>[−4,5,−1,−2]</td>
<td>−2</td>
</tr>
<tr>
<td>3</td>
<td>[5,−1,−2]</td>
<td>2</td>
</tr>
<tr>
<td>4</td>
<td>[−1,−2]</td>
<td>−3</td>
</tr>
<tr>
<td>5</td>
<td>[−2]</td>
<td>−2</td>
</tr>
</tbody>
</table>
<p>降序排列貢獻：<strong>2、1、−2、−2、−3</strong>。</p>
<p>k = 3 時選位置 3、1，按位置排列後得到 <strong>[1] [3,−4] [5,−1,−2]</strong>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-class="topic-f" data-theme="default" lang="C" class="topic-f" data-marpit-pagination="12" style="--paginate:true;--class:topic-f;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="f%E4%B8%80%E6%AC%A1%E6%8E%92%E5%BA%8F%E7%94%A2%E7%94%9F%E5%85%A8%E9%83%A8%E7%AD%94%E6%A1%88">F｜一次排序產生全部答案</h2>
<table>
<thead>
<tr>
<th>段數 k</th>
<th>新加入的貢獻</th>
<th>最大分數</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>無</td>
<td>2</td>
</tr>
<tr>
<td>2</td>
<td>+2</td>
<td>4</td>
</tr>
<tr>
<td>3</td>
<td>+1</td>
<td>5</td>
</tr>
<tr>
<td>4</td>
<td>−2</td>
<td>3</td>
</tr>
<tr>
<td>5</td>
<td>−2</td>
<td>1</td>
</tr>
<tr>
<td>6</td>
<td>−3</td>
<td>−2</td>
</tr>
</tbody>
</table>
<p>輸出：<strong>2 4 5 3 1 −2</strong>。</p>
<p>答案不一定隨段數增加：必須切出更多段時，可能被迫選負貢獻。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="topic-f" data-theme="default" lang="C" class="topic-f" data-marpit-pagination="13" style="--paginate:true;--class:topic-f;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="f%E7%82%BA%E4%BB%80%E9%BA%BC%E9%81%B8%E6%9C%80%E5%A4%A7%E7%9A%84-k%E2%88%921-%E5%80%8B">F｜為什麼選最大的 k−1 個？</h2>
<div class="cols">
<div>
<h3 id="%E5%88%87%E9%BB%9E%E4%BA%92%E7%9B%B8%E7%8D%A8%E7%AB%8B">切點互相獨立</h3>
<p>可用位置是 1…n−1，對應 p₂…pₙ。</p>
<p>任選 k−1 個不同切點，按原位置排序後，都能形成 k 個非空連續段。</p>
<p>因此只需在 n−1 個固定貢獻中，選恰好 k−1 個，使總和最大。</p>
</div>
<div>
<h3 id="%E4%BA%A4%E6%8F%9B%E8%AB%96%E8%AD%89">交換論證</h3>
<p>若選了較小值 x，卻沒選較大值 y，把 x 換成 y，仍是合法切割，分數不減。</p>
<p>重複交換，即得到最大的 k−1 個貢獻。</p>
<p><strong>即使貢獻為負，仍須選滿 k−1 個。</strong></p>
<p>排序的是切點的貢獻值；原序列不重新排序。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="topic-f" data-theme="default" lang="C" class="topic-f" data-marpit-pagination="14" style="--paginate:true;--class:topic-f;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="f%E5%BE%8C%E7%B6%B4%E5%92%8C%E8%88%87%E6%8E%92%E5%BA%8F%E6%B5%81%E7%A8%8B">F｜後綴和與排序流程</h2>
<div class="cols">
<div>
<h3 id="%E6%BC%94%E7%AE%97%E6%B3%95-1">演算法</h3>
<ol>
<li>計算序列總和 T。</li>
<li>從右往左累加，收集 pₙ、pₙ₋₁、…、p₂。</li>
<li>將這 n−1 個貢獻降序排序。</li>
<li>先輸出 T，代表 k = 1。</li>
<li>依序加入下一個貢獻並輸出，得到 k = 2…n。</li>
</ol>
</div>
<div>
<h3 id="%E8%A4%87%E9%9B%9C%E5%BA%A6%E8%88%87%E6%95%B8%E5%80%BC%E7%AF%84%E5%9C%8D">複雜度與數值範圍</h3>
<ul>
<li>後綴和：O(n)。</li>
<li>排序：O(n log n)。</li>
<li>輸出所有答案：O(n)。</li>
<li>額外空間：O(n)。</li>
</ul>
<p>總和、後綴和、答案都使用 <strong>long long</strong>。</p>
<p>答案絕對值不超過 10⁶·n(n+1)/2，可能約為 1.25×10¹⁷，需 64 位元。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="topic-f code-page" data-theme="default" lang="C" class="topic-f code-page" data-marpit-pagination="15" style="--paginate:true;--class:topic-f code-page;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="f%E5%AF%A6%E4%BD%9C">F｜實作</h2>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-comment">// a[1..n]，每筆測資呼叫一次</span>
<span class="hljs-type">long</span> <span class="hljs-type">long</span> total = <span class="hljs-number">0</span>, suffix = <span class="hljs-number">0</span>;
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">1</span>; i &lt;= n; ++i)
    total += a[i];
vector&lt;<span class="hljs-type">long</span> <span class="hljs-type">long</span>&gt; cuts;
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = n; i &gt;= <span class="hljs-number">2</span>; --i) {
    suffix += a[i];
    cuts.<span class="hljs-built_in">push_back</span>(suffix);
}
<span class="hljs-built_in">sort</span>(cuts.<span class="hljs-built_in">rbegin</span>(), cuts.<span class="hljs-built_in">rend</span>());
</code></pre>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-type">long</span> <span class="hljs-type">long</span> cur = total;
cout &lt;&lt; cur;
<span class="hljs-keyword">for</span> (<span class="hljs-type">long</span> <span class="hljs-type">long</span> gain : cuts) {
    cur += gain;
    cout &lt;&lt; <span class="hljs-string">&#x27; &#x27;</span> &lt;&lt; cur;
}
cout &lt;&lt; <span class="hljs-string">&#x27;\n&#x27;</span>;
</code></pre>
<p>不加入 p₁：它對應在第一個元素前切割，會產生空段。</p>
<p>n = 1 時 cuts 為空，只輸出 a₁。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="summary" data-theme="default" lang="C" class="summary" data-marpit-pagination="16" style="--paginate:true;--class:summary;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="if%E5%BE%9E%E6%93%8D%E4%BD%9C%E6%8E%A8%E5%B0%8E%E8%B2%A2%E7%8D%BB">I、F｜從操作推導貢獻</h2>
<table>
<thead>
<tr>
<th></th>
<th>I. Left Shifting</th>
<th>F. Divide the Sequence</th>
</tr>
</thead>
<tbody>
<tr>
<td>原本的操作</td>
<td>左移整個字串</td>
<td>將序列分段</td>
</tr>
<tr>
<td>真正需要追蹤</td>
<td>新首尾的原下標</td>
<td>每刀增加的後綴和</td>
</tr>
<tr>
<td>關鍵轉換</td>
<td>比較環上相鄰兩格</td>
<td>加權段和 = T + 切點貢獻</td>
</tr>
<tr>
<td>最佳解的取得</td>
<td>由小到大枚舉 d</td>
<td>降序取最大的 k−1 個</td>
</tr>
<tr>
<td>時間</td>
<td>O(n)</td>
<td>O(n log n)</td>
</tr>
</tbody>
</table>
<p>接下來的 H、E：把互攻關係轉成二分圖，把區間狀態轉成節點貢獻。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-class="topic-h statement" data-theme="default" lang="C" class="topic-h statement" data-marpit-pagination="17" style="--paginate:true;--class:topic-h statement;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="h%E9%A1%8C%E7%9B%AE">H｜題目</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-attack.svg" alt="" style="width:490px;" /></p>
</div>
<div>
<ul>
<li>棋盤有 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>10</mn><mn>9</mn></msup></mrow><annotation encoding="application/x-tex">10^9</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">9</span></span></span></span></span></span></span></span></span></span></span> 行、<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>10</mn><mn>9</mn></msup></mrow><annotation encoding="application/x-tex">10^9</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">9</span></span></span></span></span></span></span></span></span></span></span> 列，上有 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span> 座城堡、<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span> 個障礙</li>
<li>城堡是車：同行或同列，且中間沒有其他棋子，就能互攻</li>
<li>再放最少的障礙，讓所有互攻都消失</li>
<li>不能放在已經有棋子的格子；做不到就輸出 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">−</span><span class="mord">1</span></span></span></span></li>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo separator="true">,</mo><mi>m</mi><mo>≤</mo><mn>200</mn></mrow><annotation encoding="application/x-tex">n,m\le 200</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8304em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">n</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">m</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">200</span></span></span></span>，座標到 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>10</mn><mn>9</mn></msup></mrow><annotation encoding="application/x-tex">10^9</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">9</span></span></span></span></span></span></span></span></span></span></span></li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="topic-h" data-theme="default" lang="C" class="topic-h" data-marpit-pagination="18" style="--paginate:true;--class:topic-h;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E6%94%BB%E6%93%8A%E5%B0%8D--%E4%BB%80%E9%BA%BC%E6%99%82%E5%80%99%E7%84%A1%E8%A7%A3">攻擊對 / 什麼時候無解</h2>
<div class="cols">
<div>
<h3 id="%E6%94%BB%E6%93%8A%E5%B0%8D">攻擊對</h3>
<p>同一行把城堡和障礙一起按欄位排序。</p>
<ul>
<li>排序後緊鄰、而且兩顆都是城堡：它們正在互攻</li>
<li>中間夾著障礙或其他城堡：這一對已經被擋住</li>
<li>列的方向同樣做一次</li>
<li>不要把同一行所有城堡兩兩相連</li>
</ul>
<p>這樣得到的每一對，就是後面二分圖的一個點。</p>
</div>
<div>
<h3 id="%E4%BB%80%E9%BA%BC%E6%99%82%E5%80%99%E7%84%A1%E8%A7%A3">什麼時候無解</h3>
<p><img src="20261024-figures/fig-noblock.svg" alt="" style="width:490px;" /></p>
<ul>
<li>互攻的兩座城堡若座標只差 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn></mrow><annotation encoding="application/x-tex">1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span>，中間沒有空格</li>
<li>障礙沒有地方放，這筆資料輸出 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">−</span><span class="mord">1</span></span></span></span></li>
<li>第 4 筆樣例的 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mn>1</mn><mo separator="true">,</mo><mn>3</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(1,3)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord">1</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">3</span><span class="mclose">)</span></span></span></span> 與 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mn>2</mn><mo separator="true">,</mo><mn>3</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(2,3)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord">2</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">3</span><span class="mclose">)</span></span></span></span> 就是這種</li>
<li>每一對中間都至少有一格時，一定有解</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-class="topic-h" data-theme="default" lang="C" class="topic-h" data-marpit-pagination="19" style="--paginate:true;--class:topic-h;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E7%82%BA%E4%BB%80%E9%BA%BC%E7%94%A8%E5%8C%B9%E9%85%8D%E5%85%A9%E6%A9%AB%E5%85%A9%E7%B8%B1%E7%9A%84%E6%94%BB%E6%93%8A%E5%B0%8D">為什麼用匹配｜兩橫、兩縱的攻擊對</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-concrete.svg" alt="" style="width:560px;" /></p>
<ul>
<li>A：第 2 行，城堡在第 1、7 欄。</li>
<li>B：第 4 行，城堡在第 1、5 欄。</li>
<li>X：第 3 欄，城堡在第 1、6 行。</li>
<li>Y：第 6 欄，城堡在第 1、3 行。</li>
</ul>
<p>圖示只畫出指定攻擊對；● 是既有障礙，用來隔開其他互攻。</p>
</div>
<div>
<h3 id="%E4%B8%89%E5%80%8B%E4%BA%A4%E5%8F%89%E6%A0%BC%E5%A6%82%E4%BD%95%E9%81%B8%E5%85%A9%E5%80%8B">三個交叉格，如何選兩個？</h3>
<ul>
<li><strong>A–X：(2,3)</strong>，一顆可阻擋 A、X。</li>
<li><strong>A–Y：(2,6)</strong>，一顆可阻擋 A、Y。</li>
<li><strong>B–X：(4,3)</strong>，一顆可阻擋 B、X。</li>
<li>B 不連 Y：第 6 欄不在 B 的開區間 (1,5) 內。</li>
</ul>
<p>選 <strong>(2,6)、(4,3)</strong>，四個攻擊對全部被阻擋。</p>
<blockquote>
<p><strong>P = 4，M = 2，最少障礙 = 2。</strong></p>
</blockquote>
<p>一顆最多解決兩對，因此一顆一定不夠。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-class="topic-h" data-theme="default" lang="C" class="topic-h" data-marpit-pagination="20" style="--paginate:true;--class:topic-h;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E4%BA%8C%E5%88%86%E5%9C%96%E8%88%87%E6%9C%80%E5%A4%A7%E5%8C%B9%E9%85%8D">二分圖與最大匹配</h2>
<div class="cols">
<div>
<h3 id="%E4%BA%A4%E5%8F%89%E6%A0%BC%E5%B0%8D%E6%87%89%E4%B8%89%E6%A2%9D%E9%82%8A">交叉格對應三條邊</h3>
<p><img src="20261024-figures/fig-bipartite.svg" alt="" style="width:550px;" /></p>
<ul>
<li>左點 A、B 是橫向攻擊對；右點 X、Y 是縱向攻擊對。</li>
<li>邊為 A–X、A–Y、B–X；不存在 B–Y。</li>
<li>點代表攻擊對，邊代表可同時阻擋兩對的空格。</li>
</ul>
</div>
<div>
<h3 id="%E6%9C%80%E5%A4%A7%E5%8C%B9%E9%85%8D%E6%9C%89%E5%85%A9%E6%A2%9D%E9%82%8A">最大匹配有兩條邊</h3>
<p><img src="20261024-figures/fig-matched.svg" alt="" style="width:550px;" /></p>
<ul>
<li>選 <strong>A–Y、B–X</strong>：每個頂點恰好使用一次。</li>
<li>對應障礙 <strong>(2,6)、(4,3)</strong>，共 2 顆。</li>
<li>若先選 A–X，B 會暫時無處可配。</li>
<li>DFS 可將 A 改配 Y，再把 X 配給 B。</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-class="topic-h formula" data-theme="default" lang="C" class="topic-h formula" data-marpit-pagination="21" style="--paginate:true;--class:topic-h formula;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E4%B8%80%E6%A0%BC%E5%B0%B1%E6%98%AF%E4%B8%80%E6%A2%9D%E9%82%8A--%E6%9C%80%E5%B0%91%E5%B9%BE%E9%A1%86">一格就是一條邊 / 最少幾顆</h2>
<div class="cols">
<div>
<h3 id="%E4%B8%80%E6%A0%BC%E5%B0%B1%E6%98%AF%E4%B8%80%E6%A2%9D%E9%82%8A">一格就是一條邊</h3>
<p><img src="20261024-figures/fig-why-h.svg" alt="" style="width:900px;" /></p>
</div>
<div>
<h3 id="%E6%9C%80%E5%B0%91%E5%B9%BE%E9%A1%86">最少幾顆</h3>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>k</mi><mo>=</mo><mi>P</mi><mo>−</mo><mi>M</mi></mrow><annotation encoding="application/x-tex">k = P - M
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span></span></span></span></span></p><ul>
<li>每條匹配邊：一顆障礙同時解決兩個攻擊對</li>
<li>沒配上的 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>P</mi><mo>−</mo><mn>2</mn><mi>M</mi></mrow><annotation encoding="application/x-tex">P-2M</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">2</span><span class="mord mathnormal" style="margin-right:0.109em;">M</span></span></span></span> 個攻擊對：各自再放一顆</li>
<li>加起來是 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>M</mi><mo>+</mo><mo stretchy="false">(</mo><mi>P</mi><mo>−</mo><mn>2</mn><mi>M</mi><mo stretchy="false">)</mo><mo>=</mo><mi>P</mi><mo>−</mo><mi>M</mi></mrow><annotation encoding="application/x-tex">M+(P-2M)=P-M</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">2</span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span></span></span></span></li>
<li>下界：每個攻擊對指定一顆阻擋它的障礙。被指定兩次的障礙形成匹配，數量 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>d</mi><mo>≤</mo><mi>M</mi></mrow><annotation encoding="application/x-tex">d\le M</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8304em;vertical-align:-0.136em;"></span><span class="mord mathnormal">d</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span></span></span></span>；共放 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span> 顆時，<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>P</mi><mo>≤</mo><mi>k</mi><mo>+</mo><mi>d</mi><mo>≤</mo><mi>k</mi><mo>+</mo><mi>M</mi></mrow><annotation encoding="application/x-tex">P\le k+d\le k+M</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8193em;vertical-align:-0.136em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7778em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8304em;vertical-align:-0.136em;"></span><span class="mord mathnormal">d</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7778em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span></span></span></span>。</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="topic-h" data-theme="default" lang="C" class="topic-h" data-marpit-pagination="22" style="--paginate:true;--class:topic-h;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E5%8C%88%E7%89%99%E5%88%A9%E6%BC%94%E7%AE%97%E6%B3%95%E4%BB%A5%E5%A2%9E%E5%BB%A3%E8%B7%AF%E5%A2%9E%E5%8A%A0%E5%8C%B9%E9%85%8D">匈牙利演算法｜以增廣路增加匹配</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-hungarian-intro.svg" alt="" style="width:550px;" /></p>
<p>綠色為目前匹配；橙色箭頭為本輪搜尋方向。</p>
<p><strong>B → X → A → Y</strong> 是一條增廣路。</p>
</div>
<div>
<h3 id="%E6%89%BE%E4%BD%8D%E7%BD%AE%E5%BF%85%E8%A6%81%E6%99%82%E9%87%8D%E6%96%B0%E9%85%8D%E5%B0%8D">找位置，必要時重新配對</h3>
<ol>
<li>初始所有右點都未匹配。</li>
<li>逐一處理左點，每次嘗試一輪 DFS。</li>
<li>遇到已配對的右點，遞迴替其舊對象找其他位置。</li>
<li>找到空右點後，沿路翻轉匹配，數量增加 1。</li>
</ol>
<p>例：A 原本配 X。讓 A 改配 Y，X 就能配給 B。</p>
<p>本講義的「匈牙利」指無權二分圖的 <strong>Kuhn／DFS 增廣法</strong>；加權指派常稱 Hungarian／KM，是另一種情境。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-class="topic-h dfs-steps example" data-theme="default" lang="C" class="topic-h dfs-steps example" data-marpit-pagination="23" style="--paginate:true;--class:topic-h dfs-steps example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="dfs-%E5%A2%9E%E5%BB%A31--5-%E5%88%9D%E5%A7%8B%E5%8C%B9%E9%85%8D">DFS 增廣｜1 / 5　初始匹配</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-dfs-1.svg" alt="" style="width:560px;" /></p>
<h3 id="%E8%AE%8A%E6%95%B8%E7%8B%80%E6%85%8B">變數狀態</h3>
<table>
<thead>
<tr>
<th>變數</th>
<th>本步數值</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>matchR[X]</code></td>
<td><code>A</code></td>
</tr>
<tr>
<td><code>matchR[Y]</code></td>
<td><code>-1</code></td>
</tr>
<tr>
<td><code>vis[X]</code></td>
<td><code>false</code></td>
</tr>
<tr>
<td><code>vis[Y]</code></td>
<td><code>false</code></td>
</tr>
</tbody>
</table>
</div>
<div>
<h3 id="%E5%91%BC%E5%8F%AB%E8%88%87%E6%93%8D%E4%BD%9C">呼叫與操作</h3>
<p><code>DFS(B)</code></p>
<p>尚未開始本輪搜尋。</p>
<p><code>matchR[v]</code>：右點 v 目前記錄的左側對象；<code>-1</code> 表示未匹配。</p>
<p><code>vis[v]</code>：本輪 DFS 是否已訪問右點 v；每次從新左點出發前清空。</p>
<p>沿用前頁的 A、B、X、Y 與三條邊，觀察如何從一條匹配增為兩條。</p>
<p>目前只有 A–X。B 尚未匹配，準備呼叫 DFS(B)。</p>
<p>綠色代表目前的匹配；灰色代表可用但尚未選取的邊。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-class="topic-h dfs-steps example" data-theme="default" lang="C" class="topic-h dfs-steps example" data-marpit-pagination="24" style="--paginate:true;--class:topic-h dfs-steps example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="dfs-%E5%A2%9E%E5%BB%A32--5-%E5%B0%8B%E6%89%BE-b-%E7%9A%84%E4%BD%8D%E7%BD%AE">DFS 增廣｜2 / 5　尋找 B 的位置</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-dfs-2.svg" alt="" style="width:560px;" /></p>
<h3 id="%E8%AE%8A%E6%95%B8%E7%8B%80%E6%85%8B-1">變數狀態</h3>
<table>
<thead>
<tr>
<th>變數</th>
<th>本步數值</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>matchR[X]</code></td>
<td><code>A</code></td>
</tr>
<tr>
<td><code>matchR[Y]</code></td>
<td><code>-1</code></td>
</tr>
<tr>
<td><code>vis[X]</code></td>
<td><code>true</code></td>
</tr>
<tr>
<td><code>vis[Y]</code></td>
<td><code>false</code></td>
</tr>
</tbody>
</table>
</div>
<div>
<h3 id="%E5%91%BC%E5%8F%AB%E8%88%87%E6%93%8D%E4%BD%9C-1">呼叫與操作</h3>
<p><code>DFS(B) → DFS(A)</code></p>
<p>B 訪問 X；因 matchR[X] = A，遞迴處理 A。</p>
<p>B 只有鄰居 X。標記 vis[X]，發現 matchR[X] = A，於是遞迴呼叫 DFS(A)。</p>
<p>DFS(B) 暫停，等待 A 能否找到其他位置；此時不改匹配。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-class="topic-h dfs-steps example" data-theme="default" lang="C" class="topic-h dfs-steps example" data-marpit-pagination="25" style="--paginate:true;--class:topic-h dfs-steps example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="dfs-%E5%A2%9E%E5%BB%A33--5-%E6%9B%BF-a-%E5%B0%8B%E6%89%BE%E6%96%B0%E4%BD%8D%E7%BD%AE">DFS 增廣｜3 / 5　替 A 尋找新位置</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-dfs-3.svg" alt="" style="width:560px;" /></p>
<h3 id="%E8%AE%8A%E6%95%B8%E7%8B%80%E6%85%8B-2">變數狀態</h3>
<table>
<thead>
<tr>
<th>變數</th>
<th>本步數值</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>matchR[X]</code></td>
<td><code>A</code></td>
</tr>
<tr>
<td><code>matchR[Y]</code></td>
<td><code>-1</code></td>
</tr>
<tr>
<td><code>vis[X]</code></td>
<td><code>true</code></td>
</tr>
<tr>
<td><code>vis[Y]</code></td>
<td><code>true</code></td>
</tr>
</tbody>
</table>
</div>
<div>
<h3 id="%E5%91%BC%E5%8F%AB%E8%88%87%E6%93%8D%E4%BD%9C-2">呼叫與操作</h3>
<p><code>DFS(B) → DFS(A)</code></p>
<p>A 略過已訪問的 X，標記 vis[Y]；Y 空著，準備改配。</p>
<p>A 的鄰居是 X、Y。X 本輪已訪問，略過；標記 vis[Y] 後發現 Y 未匹配，因此找到增廣路 B–X–A–Y。</p>
<p>路徑依序為未匹配邊、匹配邊、未匹配邊，末端是空著的右點 Y。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="topic-h dfs-steps example" data-theme="default" lang="C" class="topic-h dfs-steps example" data-marpit-pagination="26" style="--paginate:true;--class:topic-h dfs-steps example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="dfs-%E5%A2%9E%E5%BB%A34--5-%E9%81%9E%E8%BF%B4%E5%9B%9E%E5%82%B3a-%E6%94%B9%E9%85%8D-y">DFS 增廣｜4 / 5　遞迴回傳：A 改配 Y</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-dfs-4.svg" alt="" style="width:560px;" /></p>
<h3 id="%E8%AE%8A%E6%95%B8%E7%8B%80%E6%85%8B-3">變數狀態</h3>
<table>
<thead>
<tr>
<th>變數</th>
<th>本步數值</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>matchR[X]</code></td>
<td><code>A</code></td>
</tr>
<tr>
<td><code>matchR[Y]</code></td>
<td><code>A</code></td>
</tr>
<tr>
<td><code>vis[X]</code></td>
<td><code>true</code></td>
</tr>
<tr>
<td><code>vis[Y]</code></td>
<td><code>true</code></td>
</tr>
</tbody>
</table>
</div>
<div>
<h3 id="%E5%91%BC%E5%8F%AB%E8%88%87%E6%93%8D%E4%BD%9C-3">呼叫與操作</h3>
<p><code>DFS(A) 回傳 true → DFS(B)</code></p>
<p>先寫入 matchR[Y] = A；matchR[X] 仍暫留 A。</p>
<p>設定 matchR[Y] = A，DFS(A) 回傳 true。接下來恢復尚未完成的 DFS(B)。</p>
<p>此刻 matchR[X] 仍是 A；這只是回傳中的暫時狀態，不能當作已完成的匹配。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="topic-h dfs-steps example" data-theme="default" lang="C" class="topic-h dfs-steps example" data-marpit-pagination="27" style="--paginate:true;--class:topic-h dfs-steps example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="dfs-%E5%A2%9E%E5%BB%A35--5-%E5%AE%8C%E6%88%90%E5%A2%9E%E5%BB%A3b-%E9%85%8D%E7%B5%A6-x">DFS 增廣｜5 / 5　完成增廣：B 配給 X</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-dfs-5.svg" alt="" style="width:560px;" /></p>
<h3 id="%E8%AE%8A%E6%95%B8%E7%8B%80%E6%85%8B-4">變數狀態</h3>
<table>
<thead>
<tr>
<th>變數</th>
<th>本步數值</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>matchR[X]</code></td>
<td><code>B</code></td>
</tr>
<tr>
<td><code>matchR[Y]</code></td>
<td><code>A</code></td>
</tr>
<tr>
<td><code>vis[X]</code></td>
<td><code>true</code></td>
</tr>
<tr>
<td><code>vis[Y]</code></td>
<td><code>true</code></td>
</tr>
</tbody>
</table>
</div>
<div>
<h3 id="%E5%91%BC%E5%8F%AB%E8%88%87%E6%93%8D%E4%BD%9C-4">呼叫與操作</h3>
<p><code>DFS(B) 回傳 true</code></p>
<p>寫入 matchR[X] = B；完成本輪，匹配數 +1。</p>
<p>DFS(B) 收到 true，設定 matchR[X] = B。最終匹配是 A–Y、B–X，匹配數由 1 增為 2。</p>
<p>若遞迴找不到空位，就不更新這條邊，改試其他鄰居；全部失敗才回傳 false。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="topic-h" data-theme="default" lang="C" class="topic-h" data-marpit-pagination="28" style="--paginate:true;--class:topic-h;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E5%8C%88%E7%89%99%E5%88%A9%E5%A2%9E%E5%BB%A3%E8%88%87%E9%87%8D%E6%96%B0%E9%85%8D%E5%B0%8D">匈牙利｜增廣與重新配對</h2>
<div class="cols">
<div>
<h3 id="%E5%BE%9E%E7%A9%BA%E5%8C%B9%E9%85%8D%E9%80%90%E4%B8%80%E5%8A%A0%E5%85%A5%E5%B7%A6%E9%BB%9E">從空匹配逐一加入左點</h3>
<ol>
<li>所有右點起初都未配對。</li>
<li>選下一個左點 u，清空這一輪的 <code>vis</code>。</li>
<li>DFS 嘗試替 u 找位置；成功時匹配數 +1。</li>
<li>失敗代表目前沒有增廣路，繼續下一個左點。</li>
</ol>
<p>每次成功保留舊匹配數，並增加一對；所有左點處理完即得最大匹配（增廣路定理）。</p>
</div>
<div>
<h3 id="dfs-%E5%A6%82%E4%BD%95%E8%AB%8B%E8%88%8A%E5%B0%8D%E8%B1%A1%E6%90%AC%E5%AE%B6">DFS 如何「請舊對象搬家」</h3>
<ul>
<li>先試 u 的右鄰居 v；本輪看過便略過。</li>
<li>v 空著：直接配給 u，回傳成功。</li>
<li>v 已配給 w：遞迴替 w 找別的位置。</li>
<li>w 搬家成功，v 才能交給 u；失敗則試下一條邊。</li>
</ul>
<p>例：B 想要 X，但 X 屬於 A。若 A 可搬到 Y，就依序更新 A–Y、B–X；失敗時不改舊匹配。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="topic-h code-page" data-theme="default" lang="C" class="topic-h code-page" data-marpit-pagination="29" style="--paginate:true;--class:topic-h code-page;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E5%A2%9E%E5%BB%A3%E7%A8%8B%E5%BC%8F--%E5%8C%B9%E9%85%8D%E4%B8%BB%E7%A8%8B%E5%BC%8F">增廣程式 / 匹配主程式</h2>
<div class="cols">
<div>
<h3 id="%E5%A2%9E%E5%BB%A3%E7%A8%8B%E5%BC%8F">增廣程式</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">dfs</span><span class="hljs-params">(<span class="hljs-type">int</span> u)</span> </span>{
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> v : g[u]) {
        <span class="hljs-keyword">if</span> (vis[v]) <span class="hljs-keyword">continue</span>;
        vis[v] = <span class="hljs-literal">true</span>;
        <span class="hljs-keyword">if</span> (matchR[v] == <span class="hljs-number">-1</span> || <span class="hljs-built_in">dfs</span>(matchR[v])) {
            matchR[v] = u;
            <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
        }
    }
    <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
}
</code></pre>
<p><code>matchR[v] = u</code> 表示右側 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span> 目前配給左側 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>u</mi></mrow><annotation encoding="application/x-tex">u</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">u</span></span></span></span>。</p>
</div>
<div>
<h3 id="%E5%8C%B9%E9%85%8D%E4%B8%BB%E7%A8%8B%E5%BC%8F">匹配主程式</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">maxMatch</span><span class="hljs-params">(<span class="hljs-type">int</span> L, <span class="hljs-type">int</span> R)</span> </span>{
    <span class="hljs-built_in">fill</span>(matchR, matchR + R, <span class="hljs-number">-1</span>);
    <span class="hljs-type">int</span> ans = <span class="hljs-number">0</span>;
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> u = <span class="hljs-number">0</span>; u &lt; L; u++) {
        <span class="hljs-built_in">fill</span>(vis, vis + R, <span class="hljs-literal">false</span>);
        <span class="hljs-keyword">if</span> (<span class="hljs-built_in">dfs</span>(u)) ans++;
    }
    <span class="hljs-keyword">return</span> ans;
}
</code></pre>
<p>使用鄰接表 g[u]，只走實際存在的邊。左右攻擊對數都小於城堡數 n，因此本題最壞 O(n³)，n ≤ 200 時可行。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-class="topic-h example" data-theme="default" lang="C" class="topic-h example" data-marpit-pagination="30" style="--paginate:true;--class:topic-h example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="h%E5%AE%98%E6%96%B9%E6%A8%A3%E4%BE%8B%E8%88%87%E7%AD%94%E6%A1%88%E9%82%84%E5%8E%9F">H｜官方樣例與答案還原</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-board.svg" alt="" style="width:550px;" /></p>
<p>綠色標記是新障礙：<strong>(2,3)、(4,6)</strong>。</p>
</div>
<div>
<h3 id="%E5%9B%9B%E5%80%8B%E6%94%BB%E6%93%8A%E5%B0%8D%E5%85%A9%E6%A2%9D%E5%8C%B9%E9%85%8D%E9%82%8A">四個攻擊對，兩條匹配邊</h3>
<table>
<thead>
<tr>
<th>橫向攻擊對</th>
<th>配對的縱向攻擊對</th>
<th>新障礙</th>
</tr>
</thead>
<tbody>
<tr>
<td>第 2 行，欄 (1,6)</td>
<td>第 3 欄，行 (1,6)</td>
<td>(2,3)</td>
</tr>
<tr>
<td>第 4 行，欄 (1,7)</td>
<td>第 6 欄，行 (2,6)</td>
<td>(4,6)</td>
</tr>
</tbody>
</table>
<p>第 6 行、第 1 欄的城堡已被舊障礙隔開。</p>
<p>P = 4、M = 2，輸出 2 顆障礙；每個攻擊對均被覆蓋。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-class="topic-h" data-theme="default" lang="C" class="topic-h" data-marpit-pagination="31" style="--paginate:true;--class:topic-h;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="h%E6%9C%AA%E5%8C%B9%E9%85%8D%E6%94%BB%E6%93%8A%E5%B0%8D%E7%9A%84%E9%82%84%E5%8E%9F">H｜未匹配攻擊對的還原</h2>
<div class="cols">
<div>
<h3 id="%E4%BE%8B%E4%B8%89%E5%80%8B%E6%94%BB%E6%93%8A%E5%B0%8D%E5%8F%AA%E6%9C%89%E4%B8%80%E6%A2%9D%E5%8C%B9%E9%85%8D%E9%82%8A">例：三個攻擊對，只有一條匹配邊</h3>
<p>橫向 A：第 2 行，欄 (1,7)。</p>
<p>橫向 B：第 4 行，欄 (1,7)。</p>
<p>縱向 X：第 3 欄，行 (1,6)。</p>
<p>二分圖只有 A–X、B–X，最大匹配 M = 1。</p>
</div>
<div>
<h3 id="%E9%81%B8-a%E2%80%93x-%E5%BE%8C%E8%A3%9C%E4%B8%8A-b">選 A–X 後，補上 B</h3>
<table>
<thead>
<tr>
<th>對象</th>
<th>還原方式</th>
<th>障礙座標</th>
</tr>
</thead>
<tbody>
<tr>
<td>匹配 A–X</td>
<td>放在兩段交叉格</td>
<td>(2,3)</td>
</tr>
<tr>
<td>未匹配 B</td>
<td>放在左端點右側一格</td>
<td>(4,2)</td>
</tr>
</tbody>
</table>
<p>共放 P − M = 3 − 1 = <strong>2 顆</strong>。</p>
<p>一般而言：未匹配橫段放 (r,c₁+1)，縱段放 (r₁+1,c)。無解檢查保證這些位置在開區間內。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="topic-h code-page" data-theme="default" lang="C" class="topic-h code-page" data-marpit-pagination="32" style="--paginate:true;--class:topic-h code-page;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E6%8E%83%E5%87%BA%E6%94%BB%E6%93%8A%E5%B0%8D--%E5%BB%BA%E9%82%8A">掃出攻擊對 / 建邊</h2>
<div class="cols">
<div>
<h3 id="%E6%8E%83%E5%87%BA%E6%94%BB%E6%93%8A%E5%B0%8D">掃出攻擊對</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-built_in">sort</span>(v.<span class="hljs-built_in">begin</span>(), v.<span class="hljs-built_in">end</span>()); <span class="hljs-comment">// 同一行，依欄位</span>
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i + <span class="hljs-number">1</span> &lt; (<span class="hljs-type">int</span>)v.<span class="hljs-built_in">size</span>(); i++) {
    <span class="hljs-keyword">if</span> (v[i].tp || v[i + <span class="hljs-number">1</span>].tp) <span class="hljs-keyword">continue</span>; <span class="hljs-comment">// 有一邊是障礙</span>
    <span class="hljs-keyword">if</span> (v[i + <span class="hljs-number">1</span>].pos == v[i].pos + <span class="hljs-number">1</span>) <span class="hljs-keyword">return</span> IMPOSSIBLE;
    hor.<span class="hljs-built_in">push_back</span>({row, v[i].pos, v[i + <span class="hljs-number">1</span>].pos});
}
</code></pre>
<p>列的方向把 <code>pos</code> 改成列號，推進 <code>ver</code>。</p>
</div>
<div>
<h3 id="%E5%BB%BA%E9%82%8A">建邊</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; H; i++) <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> j = <span class="hljs-number">0</span>; j &lt; V; j++) {
    <span class="hljs-type">int</span> col = ver[j].fixed, row = hor[i].fixed;
    <span class="hljs-keyword">if</span> (hor[i].L &lt; col &amp;&amp; col &lt; hor[i].R &amp;&amp;
        ver[j].L &lt; row &amp;&amp; row &lt; ver[j].R)
        g[i].<span class="hljs-built_in">push_back</span>(j);
}
</code></pre>
<p>交叉格 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>r</mi><mi>o</mi><mi>w</mi><mo separator="true">,</mo><mi>c</mi><mi>o</mi><mi>l</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(row,col)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span><span class="mord mathnormal">o</span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">co</span><span class="mord mathnormal" style="margin-right:0.0197em;">l</span><span class="mclose">)</span></span></span></span> 落在兩段開區間裡，而且這兩段本來就沒有棋子。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-class="topic-h code-page" data-theme="default" lang="C" class="topic-h code-page" data-marpit-pagination="33" style="--paginate:true;--class:topic-h code-page;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E9%82%84%E5%8E%9F%E6%A0%BC%E5%AD%90--h-%E9%A1%8C%E5%AE%B9%E6%98%93%E9%8C%AF">還原格子 / H 題容易錯</h2>
<div class="cols">
<div>
<h3 id="%E9%82%84%E5%8E%9F%E6%A0%BC%E5%AD%90">還原格子</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> j = <span class="hljs-number">0</span>; j &lt; V; j++) <span class="hljs-keyword">if</span> (matchR[j] != <span class="hljs-number">-1</span>) {
    <span class="hljs-type">int</span> i = matchR[j];
    usedH[i] = usedV[j] = <span class="hljs-number">1</span>;
    <span class="hljs-built_in">place</span>(hor[i].fixed, ver[j].fixed);
}
</code></pre>
<p><code>usedH[i]==0</code> 的橫向對再放 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>r</mi><mo separator="true">,</mo><msub><mi>c</mi><mn>1</mn></msub><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(r,c_1+1)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal">c</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">)</span></span></span></span>，縱向同理。多測要清鄰接表和 <code>matchR</code>。</p>
</div>
<div>
<h3 id="h-%E9%A1%8C%E5%AE%B9%E6%98%93%E9%8C%AF">H 題容易錯</h3>
<ul>
<li>同一行不相鄰的城堡也拿去連邊</li>
<li>座標差為 1 卻還去建圖</li>
<li><code>vis</code> 沒有每輪清空，或 <code>matchR</code> 沒設成 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">−</span><span class="mord">1</span></span></span></span></li>
<li>只輸出匹配的交叉格，忘了沒配上的攻擊對</li>
<li>多測沿用上一筆的邊</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="topic-h" data-theme="default" lang="C" class="topic-h" data-marpit-pagination="34" style="--paginate:true;--class:topic-h;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E7%A8%80%E7%96%8F%E5%9C%96%E8%88%87%E7%A8%A0%E5%AF%86%E5%9C%96%E9%82%8A%E6%95%B8%E6%B1%BA%E5%AE%9A%E6%90%9C%E5%B0%8B%E6%88%90%E6%9C%AC">稀疏圖與稠密圖｜邊數決定搜尋成本</h2>
<div class="cols">
<div>
<h3 id="%E7%A8%80%E7%96%8F%E5%8F%AA%E9%80%A3%E5%B0%91%E6%95%B8%E9%84%B0%E5%B1%85">稀疏：只連少數鄰居</h3>
<p><img src="20261024-figures/fig-matching-sparse.svg" alt="" style="width:550px;" /></p>
<p>左右各 q = 4 點，只有 e = 5 條邊。</p>
<p>鄰接表只儲存這 5 條邊；用矩陣則要存 16 個配對位置，搜尋時還會檢查不存在的邊。</p>
</div>
<div>
<h3 id="%E7%A8%A0%E5%AF%86%E5%B9%BE%E4%B9%8E%E6%AF%8F%E5%B0%8D%E9%83%BD%E7%9B%B8%E9%80%A3">稠密：幾乎每對都相連</h3>
<p><img src="20261024-figures/fig-matching-dense.svg" alt="" style="width:550px;" /></p>
<p>左右各 q = 4 點，有 e = 16 條邊。</p>
<p>當 e 接近 q²，鄰接表也要處理大量邊；換儲存方式無法消除逐次 DFS 的最壞成本。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="topic-h" data-theme="default" lang="C" class="topic-h" data-marpit-pagination="35" style="--paginate:true;--class:topic-h;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E5%8C%88%E7%89%99%E5%88%A9%E6%BC%94%E7%AE%97%E6%B3%95%E9%81%A9%E7%94%A8%E7%AF%84%E5%9C%8D%E8%88%87%E6%95%88%E8%83%BD%E9%99%90%E5%88%B6">匈牙利演算法｜適用範圍與效能限制</h2>
<p>設左點數 L、右點數 R，實際邊數 e；N = L + R。</p>
<table>
<thead>
<tr>
<th>方法</th>
<th>成本與限制</th>
<th>適用情況</th>
</tr>
</thead>
<tbody>
<tr>
<td>DFS 增廣＋鄰接表</td>
<td>O(L(L+R+e))；平衡且無孤點時通常寫 O(L·e)</td>
<td>小圖、實作簡單</td>
</tr>
<tr>
<td>DFS 增廣＋鄰接矩陣</td>
<td>O(L²R) 時間，O(LR) 空間</td>
<td>小型稠密圖；稀疏圖會掃描許多空位置</td>
</tr>
<tr>
<td>Hopcroft–Karp</td>
<td>O(N + e√N)；分層尋找多條最短增廣路</td>
<td>大型無權二分圖</td>
</tr>
</tbody>
</table>
<ul>
<li>左右各 q 點：e = O(q) 時，DFS 最壞約 O(q²)；e = Θ(q²) 時，最壞 O(q³)。</li>
<li><strong>稀疏大圖不宜用矩陣硬掃；大型稠密圖則要留意逐次 DFS 的立方成本。</strong></li>
<li>本題左右攻擊對數都小於城堡數 n ≤ 200，採鄰接表 DFS 足夠；本題不需要加權 Hungarian／KM。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-class="topic-hk" data-theme="default" lang="C" class="topic-hk" data-marpit-pagination="36" style="--paginate:true;--class:topic-hk;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="%E8%A3%9C%E5%85%85hopcroft%E2%80%93karp-%E7%9A%84%E7%9B%AE%E6%A8%99%E8%88%87%E5%85%A9%E5%80%8B%E9%9A%8E%E6%AE%B5">補充｜Hopcroft–Karp 的目標與兩個階段</h2>
<p><strong>目標仍是二分圖最大匹配：選最多條邊，而且每個頂點最多配給一個對象。</strong></p>
<p>逐點 DFS 每次嘗試一條增廣路，可能反覆搜尋相同區域。圖很大時，希望一次搜尋能支援多次增廣。</p>
<p>Hopcroft–Karp 將搜尋分階段，<strong>同一階段增廣多條頂點互不相交的最短路</strong>，降低總搜尋成本。</p>
<table>
<thead>
<tr>
<th>階段</th>
<th>要回答的問題</th>
<th>結果</th>
<th>是否更改匹配？</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>BFS</strong></td>
<td>空左點到空右點，最少走幾條邊？</td>
<td>最短距離與分層限制</td>
<td><strong>不改</strong></td>
</tr>
<tr>
<td><strong>DFS</strong></td>
<td>哪些最短路可一起使用？</td>
<td>選路、翻轉配對</td>
<td><strong>會改</strong></td>
</tr>
</tbody>
</table>
<p>BFS 的候選路可以重疊；DFS 最後選用的路徑必須頂點互斥。本階段完成後，重新 BFS。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-class="topic-hk" data-theme="default" lang="C" class="topic-hk" data-marpit-pagination="37" style="--paginate:true;--class:topic-hk;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="hopcroft%E2%80%93karp%E5%BE%9E%E5%85%A9%E7%B5%84%E5%B7%B2%E7%9F%A5%E7%9A%84%E5%A2%9E%E5%BB%A3%E8%B7%AF%E5%87%BA%E7%99%BC">Hopcroft–Karp｜從兩組已知的增廣路出發</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-hk-start.svg" alt="" style="width:560px;" /></p>
<p>綠色粗線是初始匹配；灰線是其他可用邊。</p>
</div>
<div>
<h3 id="%E5%85%88%E7%A2%BA%E8%AA%8D%E8%B5%B7%E9%BB%9E%E7%B5%82%E9%BB%9E%E8%88%87%E6%96%B9%E5%90%91">先確認起點、終點與方向</h3>
<ul>
<li>初始配對：<strong>A–X、C–Z</strong>，匹配數 2。</li>
<li>空左點：<strong>B、D</strong>，是 BFS 的起點。</li>
<li>空右點：<strong>Y、W</strong>，可以作為終點。</li>
</ul>
<p>走邊規則：</p>
<p><strong>未匹配邊：左 → 右。</strong></p>
<p><strong>已匹配邊：右 → 左。</strong></p>
<p>接下來把同一張圖按搜尋方向排成兩列；頂點與邊都不變。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-class="topic-hk example" data-theme="default" lang="C" class="topic-hk example" data-marpit-pagination="38" style="--paginate:true;--class:topic-hk example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="bfs-%E2%91%A0%E6%89%80%E6%9C%89%E7%A9%BA%E5%B7%A6%E9%BB%9E%E7%9A%84%E8%B7%9D%E9%9B%A2%E8%A8%AD%E7%82%BA-0">BFS ①｜所有空左點的距離設為 0</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-hk-clear-bfs-0.svg" alt="" style="width:560px;" /></p>
<p>上列與下列是同一張二分圖的兩條通道。</p>
</div>
<div>
<h3 id="dist-%E8%A1%A8%E7%A4%BA%E8%B5%B0%E4%BA%86%E5%B9%BE%E6%A2%9D%E9%82%8A">dist 表示走了幾條邊</h3>
<ul>
<li>dist[B] = dist[D] = <strong>0</strong>。</li>
<li>其他點尚未到達，距離為 <strong>∞</strong>。</li>
<li>佇列 Q = <strong>[B,D]</strong>，由左側依序取出。</li>
</ul>
<p>初始配對仍為 <strong>A–X、C–Z</strong>。</p>
<p>此時尚未選路，也沒有任何改配動作。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-class="topic-hk example" data-theme="default" lang="C" class="topic-hk example" data-marpit-pagination="39" style="--paginate:true;--class:topic-hk example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="bfs-%E2%91%A1%E8%B5%B0%E6%9C%AA%E5%8C%B9%E9%85%8D%E9%82%8A%E5%86%8D%E6%B2%BF%E5%8E%9F%E9%85%8D%E5%B0%8D%E5%9B%9E%E5%B7%A6%E5%81%B4">BFS ②｜走未匹配邊，再沿原配對回左側</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-hk-clear-bfs-2.svg" alt="" style="width:560px;" /></p>
<p>每往右走一條箭頭，dist 就增加 1。</p>
</div>
<div>
<h3 id="%E4%BE%9D%E5%BA%8F%E6%93%B4%E5%B1%95%E5%85%A9%E5%B1%A4">依序擴展兩層</h3>
<table>
<thead>
<tr>
<th>從哪些點出發？</th>
<th>走哪種邊？</th>
<th>新發現的距離</th>
</tr>
</thead>
<tbody>
<tr>
<td>B、D</td>
<td>未匹配邊</td>
<td>X=1、Z=1</td>
</tr>
<tr>
<td>X、Z</td>
<td>已匹配邊</td>
<td>A=2、C=2</td>
</tr>
</tbody>
</table>
<p>佇列依序為 <strong>[B,D] → [X,Z] → [A,C]</strong>（每層處理完成後）。</p>
<p>A、C 仍不是空右點，所以還要往前找。</p>
<p><strong>到達 A 不代表 A 已搬家：BFS 仍未更改配對。</strong></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-class="topic-hk example" data-theme="default" lang="C" class="topic-hk example" data-marpit-pagination="40" style="--paginate:true;--class:topic-hk example;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="bfs-%E2%91%A2%E6%89%BE%E5%88%B0%E6%9C%80%E8%BF%91%E7%9A%84%E7%A9%BA%E5%8F%B3%E9%BB%9E%E8%B7%9D%E9%9B%A2%E7%82%BA-3">BFS ③｜找到最近的空右點，距離為 3</h2>
<div class="cols">
<div>
<p><img src="20261024-figures/fig-hk-clear-bfs-3.svg" alt="" style="width:560px;" /></p>
<p>Y、W 是空右點；兩條最短增廣路都長 3。</p>
</div>
<div>
<h3 id="%E6%8A%8A%E5%90%8C%E6%A8%A3%E7%9F%AD%E7%9A%84%E7%B5%82%E9%BB%9E%E9%83%BD%E6%89%BE%E5%87%BA%E4%BE%86">把同樣短的終點都找出來</h3>
<ul>
<li>從 A 走 A→Y，得到 <strong>dist[Y]=3</strong>。</li>
<li>從 C 走 C→W，得到 <strong>dist[W]=3</strong>。</li>
<li>找到 Y 後仍要處理 C，不能立即結束整輪。</li>
</ul>
<p>BFS 留下：<strong>0 → 1 → 2 → 3</strong> 的分層資訊。</p>
<p>原配對仍為 <strong>A–X、C–Z</strong>，匹配數仍是 <strong>2</strong>。</p>
<p>下一階段 DFS 只能沿距離增加 1 的邊，並在距離 3 的空右點結束。</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-class="topic-hk" data-theme="default" lang="C" class="topic-hk" data-marpit-pagination="41" style="--paginate:true;--class:topic-hk;--theme:default;" data-marpit-pagination-total="68" data-size="16:9">
<h2 id="bfs%E7%AC%AC%E4%B8%80%E6%AC%A1%E6%89%BE%E5%88%B0%E7%A9%BA%E5%8F%B3%E9%BB%9E%E7%A2%BA%E5%AE%9A%E6%9C%AC%E8%BC%AA%E6%9C%80%E7%9F%AD%E8%B7%9D%E9%9B%A2">BFS｜第一次找到空右點，確定本輪最短距離</h2>
<div class="cols">
<div>
<h3 id="%E6%9C%AC%E4%BE%8B%E7%82%BA%E4%BB%80%E9%BA%BC%E5%81%9C%E5%9C%A8%E8%B7%9D%E9%9B%A2-3">本例為什麼停在距離 3？</h3>
<table>
<thead>
<tr>
<th>距離</th>
<th>到達的點</th>
<th>能否作為增廣路終點？</th>
</tr>
</thead>
<tbody>
<tr>
<td>0</td>
<td>B、D</td>
<td>否，這是左側起點</td>
</tr>
<tr>
<td>1</td>
<td>X、Z</td>
<td>否，右點已匹配</td>
</tr>
<tr>
<td>2</td>
<td>A、C</td>
<td>否，回到左點</td>
</tr>
<tr>
<td>3</td>
<td>Y、W</td>
<td><strong>是，右點未匹配</strong></td>
</tr>
</tbody>
</table>
<p>BFS 依距離遞增搜尋；第一次到達空右點的距離，就是最短增廣路長度。</p>
</div>
<div>
